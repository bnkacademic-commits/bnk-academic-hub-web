<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<script>(function(){try{var t=localStorage.getItem('bnkah_theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<title>Hub ของฉัน — BNKAcademicHub</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="app-topbar"></div>

  <div class="container">
    <div class="page-header">
      <h1 id="welcomeHeading">ยินดีต้อนรับ</h1>
      <p>อัพโหลด จัดการ และแชร์ผลงานของคุณให้ฝ่ายวิชาการหรือบุคคลภายนอกดูได้</p>
    </div>

    <div class="card" id="annCard" hidden>
      <div class="section-title"><svg class="ui-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h2l4.5 3.5V6.5L6 10H4a1 1 0 0 0-1 1z"/><path d="M17 8a4.5 4.5 0 0 1 0 8M20 5.5a8.5 8.5 0 0 1 0 13"/></svg> ประกาศจากฝ่ายวิชาการ</div>
      <div id="hubAnnList"><div class="loading">กำลังโหลด</div></div>
    </div>

    <div class="card">
      <!-- ปฏิทิน (ซ้าย) + ปุ่ม "หน้าผลงานของฉัน" + เช็คลิสต์การส่งงาน (ขวา) วางติดกัน (ตั้งแต่ V9.8, ปรับคอลัมน์ขวาใน V9.9) -->
      <div class="dash-cal-layout">
        <div class="dash-cal-main">
          <div class="calendar-header">
            <div class="section-title" style="margin-bottom:0;"><svg class="ui-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg> ปฏิทิน</div>
            <div style="display:flex; gap:6px; align-items:center;">
              <button class="btn btn-ghost btn-sm" id="calPrev">‹</button>
              <span class="month-label" id="calLabel">-</span>
              <button class="btn btn-ghost btn-sm" id="calNext">›</button>
            </div>
          </div>
          <div class="term-badge" id="currentTermBadge">-</div>
          <div class="calendar-grid" id="calGrid"></div>
        </div>
        <div class="dash-cal-side">
          <button class="btn btn-secondary dash-portfolio-btn" id="btnShowQr" type="button">🔗 หน้าผลงานของฉัน</button>
          <div class="dash-checklist">
            <div class="dash-checklist-title">✅ เช็คลิสต์การส่งงาน</div>
            <div class="dash-checklist-body" id="assignmentChecklistBody"><div class="loading">กำลังโหลด</div></div>
          </div>
        </div>
      </div>
      <!-- "กำหนดส่งงาน" (เดิมชื่อ "กำหนดการใกล้ถึง" แล้วเปลี่ยนเป็น "กำหนดการ" ใน V10.0/V10.1 ก่อนเปลี่ยนมาเป็นชื่อนี้) ย้ายออกมานอกกริด 2 คอลัมน์ด้านบน ให้ยาวเต็มความกว้างของการ์ด แต่ยังเรียงลงมาเป็นแถวเดียวตามเดิม -->
      <div id="calEventsUpcoming" style="margin-top:18px;"></div>
    </div>

    <div class="card">
      <div class="section-title"><svg class="ui-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg> ผลงานของฉันทั้งหมด</div>
      <div class="filter-row">
        <input type="search" id="subSearch" placeholder="ค้นหาชื่อผลงาน/ประเภทงาน" />
        <select id="subFilterYear"><option value="">ทุกปีการศึกษา</option></select>
        <select id="subFilterSemester">
          <option value="">ทุกภาคเรียน</option>
          <option value="1">ภาคเรียนที่ 1</option>
          <option value="2">ภาคเรียนที่ 2</option>
          <option value="summer">ภาคฤดูร้อน</option>
        </select>
        <!-- ปุ่ม "ส่งงาน" ย้ายมาที่นี่ + เปลี่ยนชื่อเป็น "ส่งงาน (กำหนดเอง)" ตั้งแต่ V10.0 (ก่อนหน้านี้เป็นการ์ดแยกด้านบน) -->
        <button class="btn btn-primary btn-sm" id="openUploadBtn" type="button">📤 ส่งงาน (กำหนดเอง)</button>
      </div>
      <div id="submissionList"><div class="loading">กำลังโหลด</div></div>
    </div>
  </div>

  <!-- Upload (ส่งงาน) Modal -->
  <div class="modal-backdrop" id="uploadModal" hidden>
    <div class="modal-box" style="max-width:480px;">
      <button type="button" class="modal-close-x" id="uploadModalCloseX" aria-label="ปิด">✕</button>
      <h3>ส่งงาน</h3>
      <div id="uploadError" class="error-box" hidden></div>
      <form id="uploadForm" style="text-align:left;">
        <div class="field-row">
          <div class="field">
            <label for="upYear">ปีการศึกษา</label>
            <select id="upYear"></select>
          </div>
          <div class="field">
            <label for="upSemester">ภาคเรียน</label>
            <select id="upSemester">
              <option value="1">ภาคเรียนที่ 1</option>
              <option value="2">ภาคเรียนที่ 2</option>
              <option value="summer">ภาคฤดูร้อน</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="upCategory">ประเภทงาน</label>
          <select id="upCategory"><option value="">กำลังโหลด...</option></select>
        </div>
        <div id="upCustomFields"></div>
        <div class="field">
          <label>ไฟล์ผลงาน (สูงสุด 10 ไฟล์ ไม่เกิน 25MB ต่อไฟล์)</label>
          <div class="dropzone" id="dropzone" tabindex="0">
            <div>📎 ลากไฟล์มาวางที่นี่ หรือกดเพื่อเลือกไฟล์</div>
            <input type="file" id="upFiles" multiple hidden />
          </div>
          <div id="fileChipList"></div>
        </div>
        <button class="btn btn-primary btn-full" type="submit" id="uploadConfirmBtn">ยืนยันส่ง</button>
      </form>
    </div>
  </div>

  <!-- QR Modal -->
  <div class="modal-backdrop" id="qrModal" hidden>
    <div class="modal-box">
      <button type="button" class="modal-close-x" id="qrModalCloseX" aria-label="ปิด">✕</button>
      <h3>หน้าผลงานของฉัน</h3>
      <div id="qrcode-box"></div>
      <div class="qr-link" id="qrLinkText"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="qrCopyBtn">คัดลอกลิงก์</button>
        <button class="btn btn-ghost" id="qrCloseBtn">ปิด</button>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="assets/api.js"></script>
  <script src="assets/qrcode.min.js"></script>
  <script>
    // รายการ "ข้อมูลที่ต้องกรอกเพิ่มเติม" ต่อประเภทงาน (ตั้งแต่ V-ถัดไปหลัง V10.1) — คัดลอกมาจาก CUSTOM_FIELD_DEFS ฝั่ง Worker (worker/src/handlers/admin.js) โดยเจตนา (ไม่ได้ดึงผ่าน API)
    var CUSTOM_FIELD_DEFS = [
      { key: 'eventDate', label: 'วันที่', type: 'date', hint: 'เผื่อไว้สำหรับเกียรติบัตรการอบรม วันที่เข้าร่วม' },
      { key: 'location', label: 'สถานที่อบรม', type: 'text', hint: 'เผื่อไว้สำหรับเกียรติบัตรที่บอกสถานที่อบรม' },
      { key: 'award', label: 'รางวัล', type: 'text', hint: 'เผื่อไว้สำหรับเกียรติบัตรที่เป็นรางวัล' },
      { key: 'studentName', label: 'ชื่อนักเรียน', type: 'text', hint: 'เผื่อไว้สำหรับเกียรติบัตรที่เป็นผลงานนักเรียนแต่ครูเป็นผู้สอน' }
    ];
    // แสดงค่าข้อมูลเพิ่มเติมที่กรอกไว้ตอนส่งงาน (ถ้ามี) เป็นบรรทัด meta ต่อท้ายรายการผลงาน (ตั้งแต่ V-ถัดไปหลัง V10.1)
    function formatCustomFieldValuesLine(values) {
      if (!values) return '';
      var parts = CUSTOM_FIELD_DEFS.filter(function (d) { return values[d.key]; })
        .map(function (d) { return d.label + ': ' + escapeHtml(values[d.key]); });
      return parts.length > 0 ? '<div class="sub-item-meta">' + parts.join(' · ') + '</div>' : '';
    }

    var session = requireHubAccess();
    if (session) mountChrome('dashboard');
    if (session) document.getElementById('welcomeHeading').textContent = 'ยินดีต้อนรับ, ' + session.name;

    // ---------- ปีการศึกษา options ----------
    (function fillYearOptions() {
      var beYear = new Date().getFullYear() + 543;
      var sel = document.getElementById('upYear');
      for (var y = beYear + 1; y >= beYear - 3; y--) {
        var opt = document.createElement('option');
        opt.value = y; opt.textContent = 'ปีการศึกษา ' + y;
        if (y === beYear) opt.selected = true;
        sel.appendChild(opt);
      }
    })();

    // ---------- ประกาศจากฝ่ายวิชาการ ----------
    async function loadHubAnnouncements() {
      var card = document.getElementById('annCard');
      var wrap = document.getElementById('hubAnnList');
      try {
        var rows = await apiCall('hubListAnnouncements', {});
        // ไม่มีประกาศ -> ซ่อนการ์ดนี้ไปเลย ไม่ต้องโชว์กล่องว่างเปล่าค้างไว้ (V9.5)
        if (rows.length === 0) { card.hidden = true; return; }
        card.hidden = false;
        // หน้าฮับไม่บอกชื่อผู้แจ้งประกาศ บอกแค่ "จากฝ่ายวิชาการ" เสมอ (ตั้งแต่ V10.0 — ชื่อผู้แจ้งจริงยังดูได้จากหน้าตั้งค่า > แท็บประกาศ สำหรับฝ่ายวิชาการ)
        wrap.innerHTML = rows.map(function (a) {
          return '<div class="event-list-item hub-ann-item"><div style="flex:1;"><div class="sub-item-title">' + escapeHtml(a.title) + '</div>' +
            (a.message ? '<div class="sub-item-desc">' + escapeHtml(a.message) + '</div>' : '') +
            '<div class="sub-item-meta">จากฝ่ายวิชาการ · ' + formatDateTimeThai(a.createdAt) + '</div></div></div>';
        }).join('');
      } catch (err) {
        card.hidden = false;
        wrap.innerHTML = '<div class="error-box">' + escapeHtml(err.message) + '</div>';
      }
    }
    loadHubAnnouncements();

    // ---------- QR modal ----------
    var qrModal = document.getElementById('qrModal');
    document.getElementById('btnShowQr').addEventListener('click', function () {
      var url = location.origin + location.pathname.replace(/dashboard\.html$/, '') + 'view.html?u=' + encodeURIComponent(session.username);
      document.getElementById('qrLinkText').textContent = url;
      var box = document.getElementById('qrcode-box');
      box.innerHTML = '';
      new QRCode(box, { text: url, width: 176, height: 176 });
      showModalEl(qrModal);
    });
    document.getElementById('qrCloseBtn').addEventListener('click', function () { hideModalEl(qrModal); });
    document.getElementById('qrModalCloseX').addEventListener('click', function () { hideModalEl(qrModal); });
    document.getElementById('qrCopyBtn').addEventListener('click', function () {
      var text = document.getElementById('qrLinkText').textContent;
      try { navigator.clipboard.writeText(text); showToast('คัดลอกลิงก์แล้ว'); } catch (e) { showToast('คัดลอกไม่สำเร็จ ลองคัดลอกด้วยตนเอง', true); }
    });

    // ---------- ส่งงาน (Upload) modal ----------
    var uploadModal = document.getElementById('uploadModal');
    var selectedFiles = [];
    var MAX_UPLOAD_FILES = 10;

    function renderFileChips() {
      var wrap = document.getElementById('fileChipList');
      if (selectedFiles.length === 0) { wrap.innerHTML = ''; return; }
      wrap.innerHTML = '<div class="hint" style="margin:8px 0 2px;">เลือกแล้ว ' + selectedFiles.length + '/' + MAX_UPLOAD_FILES + ' ไฟล์</div>' +
        selectedFiles.map(function (f, i) {
          return '<div class="file-chip"><span>' + escapeHtml(f.name) + '</span><button type="button" class="file-chip-remove" data-idx="' + i + '">&times;</button></div>';
        }).join('');
      wrap.querySelectorAll('.file-chip-remove').forEach(function (btn) {
        btn.addEventListener('click', function () {
          selectedFiles.splice(parseInt(btn.getAttribute('data-idx'), 10), 1);
          renderFileChips();
        });
      });
    }

    function addFiles(fileList) {
      var incoming = Array.from(fileList);
      var room = MAX_UPLOAD_FILES - selectedFiles.length;
      if (incoming.length > room) {
        showToast('เลือกไฟล์ได้สูงสุด ' + MAX_UPLOAD_FILES + ' ไฟล์ต่อครั้ง (เพิ่มได้อีก ' + Math.max(room, 0) + ' ไฟล์)', true);
      }
      incoming.slice(0, room).forEach(function (f) { selectedFiles.push(f); });
      renderFileChips();
    }

    var dropzone = document.getElementById('dropzone');
    dropzone.addEventListener('click', function () { document.getElementById('upFiles').click(); });
    dropzone.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') document.getElementById('upFiles').click(); });
    dropzone.addEventListener('dragover', function (e) { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', function () { dropzone.classList.remove('dragover'); });
    dropzone.addEventListener('drop', function (e) {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
    });
    document.getElementById('upFiles').addEventListener('change', function (e) {
      addFiles(e.target.files);
      e.target.value = '';
    });

    var uploadCategories = []; // เก็บไว้ให้ renderUploadCustomFields ใช้หา customFields ของประเภทงานที่เลือก (ตั้งแต่ V-ถัดไปหลัง V10.1)
    async function loadUploadCategories() {
      var sel = document.getElementById('upCategory');
      try {
        var cats = await apiCall('hubListWorkCategories', {});
        uploadCategories = cats;
        categoryColorMap = buildCategoryColorMap(cats);
        if (cats.length === 0) {
          sel.innerHTML = '<option value="">(ยังไม่มีประเภทงาน — ติดต่อฝ่ายวิชาการ)</option>';
          return;
        }
        sel.innerHTML = cats.map(function (c) { return '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>'; }).join('');
      } catch (err) {
        sel.innerHTML = '<option value="">โหลดประเภทงานไม่สำเร็จ</option>';
      }
    }
    // แสดงช่องกรอกข้อมูลเพิ่มเติมตามที่ประเภทงานที่เลือกกำหนดไว้ (ตั้งแต่ V-ถัดไปหลัง V10.1)
    function renderUploadCustomFields() {
      var box = document.getElementById('upCustomFields');
      var catId = document.getElementById('upCategory').value;
      var cat = uploadCategories.filter(function (c) { return c.id === catId; })[0];
      var keys = (cat && cat.customFields) || [];
      if (keys.length === 0) { box.innerHTML = ''; return; }
      box.innerHTML = keys.map(function (k) {
        var def = CUSTOM_FIELD_DEFS.filter(function (d) { return d.key === k; })[0];
        if (!def) return '';
        return '<div class="field"><label for="upcf_' + def.key + '">' + escapeHtml(def.label) + '</label>' +
          '<input id="upcf_' + def.key + '" type="' + (def.type === 'date' ? 'date' : 'text') + '" data-custom-field="' + def.key + '" required placeholder="' + escapeHtml(def.hint) + '" />' +
          '</div>';
      }).join('');
    }
    document.getElementById('upCategory').addEventListener('change', renderUploadCustomFields);

    // preset (ไม่บังคับ): { categoryId, academicYear, semester } — ใช้ตอนกดปุ่ม "ส่งงาน" จากรายการแจ้งเตือนกำหนดส่งในปฏิทิน (V9.5)
    // เพื่อเลือกภาคเรียน/ปีการศึกษา/ประเภทงานของกำหนดการนั้นให้อัตโนมัติ ไม่ต้องเลือกเองซ้ำ
    function openUploadModal(preset) {
      selectedFiles = [];
      renderFileChips();
      document.getElementById('uploadError').hidden = true;
      if (preset && preset.academicYear) document.getElementById('upYear').value = preset.academicYear;
      if (preset && preset.semester) document.getElementById('upSemester').value = preset.semester;
      document.getElementById('upCustomFields').innerHTML = '';
      loadUploadCategories().then(function () {
        if (preset && preset.categoryId) document.getElementById('upCategory').value = preset.categoryId;
        renderUploadCustomFields();
      });
      showModalEl(uploadModal);
    }
    document.getElementById('openUploadBtn').addEventListener('click', function () { openUploadModal(); });
    document.getElementById('uploadModalCloseX').addEventListener('click', function () { hideModalEl(uploadModal); });

    document.getElementById('uploadForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var errBox = document.getElementById('uploadError');
      errBox.hidden = true;

      var categoryId = document.getElementById('upCategory').value;
      var academicYear = document.getElementById('upYear').value;
      var semester = document.getElementById('upSemester').value;

      if (!categoryId) { errBox.textContent = 'กรุณาเลือกประเภทงาน'; errBox.hidden = false; return; }
      if (selectedFiles.length === 0) { errBox.textContent = 'กรุณาเลือกไฟล์อย่างน้อย 1 ไฟล์'; errBox.hidden = false; return; }

      // เก็บค่าข้อมูลเพิ่มเติมตามที่ประเภทงานนี้กำหนด (ตั้งแต่ V-ถัดไปหลัง V10.1) — required ที่ input บังคับกรอกไว้แล้วในหน้าเว็บ (HTML5 validation), Worker เช็กซ้ำอีกชั้นด้วย
      var customFieldValues = {};
      document.querySelectorAll('#upCustomFields [data-custom-field]').forEach(function (inp) {
        customFieldValues[inp.getAttribute('data-custom-field')] = inp.value.trim();
      });

      var categoryLabel = document.getElementById('upCategory').selectedOptions[0].textContent;
      var semLabel = semester === 'summer' ? 'ภาคฤดูร้อน' : 'ภาคเรียนที่ ' + semester;
      var ok = await askConfirm(
        'ยืนยันส่งงาน ' + selectedFiles.length + ' ไฟล์ ประเภท "' + categoryLabel + '" ปีการศึกษา ' + academicYear + ' ' + semLabel + ' ใช่หรือไม่?',
        'ยืนยันการส่งงาน'
      );
      if (!ok) return;

      var filesToUpload = selectedFiles.slice();
      var r = await withProgress('กำลังส่งงาน', async function (p) {
        var failed = [];
        for (var i = 0; i < filesToUpload.length; i++) {
          var f = filesToUpload[i];
          p.setProgress(Math.round((i / filesToUpload.length) * 100), 'กำลังส่ง ' + (i + 1) + '/' + filesToUpload.length + ': ' + f.name);
          try {
            await submitWorkFile(f, {
              academicYear: academicYear,
              semester: semester,
              categoryId: categoryId,
              customFieldValues: customFieldValues
            });
          } catch (err) {
            failed.push(f.name + ': ' + err.message);
          }
          p.setProgress(Math.round(((i + 1) / filesToUpload.length) * 100));
        }
        if (failed.length > 0) {
          throw new Error('ส่งไม่สำเร็จ ' + failed.length + '/' + filesToUpload.length + ' ไฟล์ — ' + failed.join('; '));
        }
        return { count: filesToUpload.length };
      }, { successLabel: 'ส่งงานทั้งหมด ' + filesToUpload.length + ' ไฟล์เรียบร้อยแล้ว' });

      if (r.ok) {
        hideModalEl(uploadModal);
        selectedFiles = [];
        renderFileChips();
        document.getElementById('uploadForm').reset();
      } else {
        errBox.textContent = r.error.message;
        errBox.hidden = false;
      }
      loadSubmissions();
    });

    // ---------- Submissions list (ค้นหา + กรองปีการศึกษา/ภาคเรียน — ค่าเริ่มต้นคือเทอมปัจจุบันตามเวลาจริง) ----------
    var allSubmissions = [];
    var _subFiltersInitialized = false;
    // { categoryId: color } — ใช้แสดงจุดสีหน้าชื่อประเภทงานในรายการผลงาน/ปฏิทิน (ตั้งแต่ V9.7)
    var categoryColorMap = {};
    async function refreshCategoryColors() {
      try {
        var cats = await apiCall('hubListWorkCategories', {});
        categoryColorMap = buildCategoryColorMap(cats);
        renderSubmissions();
        renderCalendar();
        renderAssignmentChecklist();
      } catch (err) { /* ไม่ต้องแจ้ง error — แค่ตกไปใช้สีเริ่มต้นแทน ไม่ใช่ปัญหาที่ควรขวางผู้ใช้ */ }
    }

    function fillSubFilters() {
      var yearSel = document.getElementById('subFilterYear');
      var curYear = yearSel.value;
      var years = Array.from(new Set(allSubmissions.map(function (s) { return s.academicYear; }))).filter(Boolean);
      var term = currentAcademicTerm();
      if (years.indexOf(term.year) === -1) years.push(term.year); // โชว์ปีการศึกษาปัจจุบันเป็นตัวเลือกเสมอ แม้จะยังไม่เคยมีผลงานส่งในปีนี้เลยก็ตาม
      years.sort().reverse();
      yearSel.innerHTML = '<option value="">ทุกปีการศึกษา</option>';
      years.forEach(function (y) {
        var opt = document.createElement('option');
        opt.value = y; opt.textContent = 'ปีการศึกษา ' + y;
        yearSel.appendChild(opt);
      });
      if (!_subFiltersInitialized) {
        // ตั้งค่าเริ่มต้นเป็นเทอมปัจจุบันตามเวลาจริงแค่ตอนโหลดหน้าครั้งแรกเท่านั้น (ครั้งต่อไปคงค่าที่ผู้ใช้เลือกไว้เอง)
        yearSel.value = term.year;
        document.getElementById('subFilterSemester').value = term.semester;
        _subFiltersInitialized = true;
      } else if (years.indexOf(curYear) !== -1) {
        yearSel.value = curYear;
      }
    }

    function renderSubmissions() {
      var el = document.getElementById('submissionList');
      if (allSubmissions.length === 0) {
        el.innerHTML = '<div class="empty-state">ยังไม่มีผลงานที่อัพโหลด</div>';
        return;
      }
      var search = document.getElementById('subSearch').value.trim().toLowerCase();
      var fYear = document.getElementById('subFilterYear').value;
      var fSem = document.getElementById('subFilterSemester').value;
      var subs = allSubmissions.filter(function (s) {
        if (fYear && s.academicYear !== fYear) return false;
        if (fSem && s.semester !== fSem) return false;
        if (search) {
          var hay = (s.title + ' ' + (s.categoryName || '') + ' ' + (s.description || '')).toLowerCase();
          if (hay.indexOf(search) === -1) return false;
        }
        return true;
      });
      if (subs.length === 0) {
        el.innerHTML = '<div class="empty-state">ไม่พบผลงานที่ตรงกับเงื่อนไขที่เลือก</div>';
        return;
      }
      var groups = {};
      subs.forEach(function (s) {
        var key = s.academicYear + '|' + s.semester;
        if (!groups[key]) groups[key] = { academicYear: s.academicYear, semester: s.semester, items: [] };
        groups[key].items.push(s);
      });
      var keys = Object.keys(groups).sort().reverse();
      var html = '';
      keys.forEach(function (k) {
        var g = groups[k];
        var semLabel = g.semester === 'summer' ? 'ภาคฤดูร้อน' : 'ภาคเรียนที่ ' + g.semester;
        html += '<div class="year-group"><div class="year-group-title">ปีการศึกษา ' + escapeHtml(g.academicYear) + ' — ' + semLabel + '</div>';
        g.items.forEach(function (s) {
          html += '<div class="sub-item">' +
            '<div><div class="sub-item-title">' + escapeHtml(s.title) + (s.categoryName ? ' <span class="badge badge-admin">' + categoryDotHtml(categoryColorMap[s.categoryId]) + escapeHtml(s.categoryName) + '</span>' : '') + '</div>' +
            (s.description ? '<div class="sub-item-desc">' + escapeHtml(s.description) + '</div>' : '') +
            formatCustomFieldValuesLine(s.customFieldValues) +
            '<div class="sub-item-meta">อัพโหลดเมื่อ ' + formatDateThai(s.uploadedAt) + ' · <a href="' + s.fileUrl + '" target="_blank" rel="noopener">เปิดไฟล์</a></div></div>' +
            '<div class="sub-item-actions"><button class="btn btn-danger btn-sm" data-id="' + s.id + '" data-name="' + escapeHtml(s.title) + '">ลบ</button></div>' +
            '</div>';
        });
        html += '</div>';
      });
      el.innerHTML = html;
      el.querySelectorAll('button[data-id]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          var ok = await askConfirm('ต้องการลบผลงาน "' + btn.getAttribute('data-name') + '" ใช่หรือไม่? การลบไม่สามารถกู้คืนได้', 'ยืนยันการลบผลงาน');
          if (!ok) return;
          var subId = btn.getAttribute('data-id');
          var r = await withProgress('กำลังลบผลงาน', function () {
            return apiCall('teacherDelete', { submissionId: subId });
          }, { successLabel: 'ลบผลงานแล้ว' });
          if (r.ok) loadSubmissions();
        });
      });
    }

    async function loadSubmissions() {
      var el = document.getElementById('submissionList');
      try {
        allSubmissions = await apiCall('teacherListMine', {});
        fillSubFilters();
        renderSubmissions();
        renderAssignmentChecklist();
      } catch (err) {
        el.innerHTML = '<div class="error-box">' + escapeHtml(err.message) + '</div>';
      }
    }
    document.getElementById('subSearch').addEventListener('input', renderSubmissions);
    document.getElementById('subFilterYear').addEventListener('change', renderSubmissions);
    document.getElementById('subFilterSemester').addEventListener('change', renderSubmissions);
    loadSubmissions();

    // ---------- Calendar ----------
    var calState = { year: new Date().getFullYear(), month: new Date().getMonth(), events: [] };
    var thaiMonths = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
    var thaiDow = ['อา','จ','อ','พ','พฤ','ศ','ส'];

    async function loadCalendar() {
      try { calState.events = await apiCall('teacherListCalendar', {}); } catch (err) { calState.events = []; }
      renderCalendar();
      renderAssignmentChecklist();
    }
    // ครอบคลุมทั้งช่วงวันที่ (date ถึง endDate) ไม่ใช่แค่วันเริ่มต้น — เผื่อกำหนดการนี้เป็นช่วงระยะเวลาส่งงานหลายวัน
    function eventsOnDate(dateStr) { return calState.events.filter(function (e) { return dateStr >= e.date && dateStr <= (e.endDate || e.date); }); }

    // ---------- จัดเรียง "แถว" (lane) ของแถบสีกำหนดการ ให้กำหนดการเดียวกันอยู่แถวเดิมทุกวันที่มันครอบคลุม (ตั้งแต่ V10.0) ----------
    // ใช้หลักการเดียวกับ Gantt chart แบบง่าย: ไล่กำหนดการที่เกี่ยวข้องกับเดือนที่กำลังแสดงตามวันเริ่มต้น แล้วจัดลงแถวว่างแถวแรกที่ไม่ทับกับกำหนดการอื่นที่ยังไม่จบ
    function computeEventLanes(events, monthStart, monthEnd) {
      var relevant = events.filter(function (e) {
        var s = e.date, en = e.endDate || e.date;
        return en >= monthStart && s <= monthEnd;
      }).slice().sort(function (a, b) { return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
      var laneEndDates = [];
      var laneOf = {};
      relevant.forEach(function (e) {
        var s = e.date, en = e.endDate || e.date;
        var placed = false;
        for (var i = 0; i < laneEndDates.length; i++) {
          if (laneEndDates[i] < s) { laneEndDates[i] = en; laneOf[e.id] = i; placed = true; break; }
        }
        if (!placed) { laneEndDates.push(en); laneOf[e.id] = laneEndDates.length - 1; }
      });
      return laneOf;
    }
    var MAX_CALENDAR_LANES = 2; // ช่องปฏิทินเล็ก แสดงแถบสีซ้อนกันได้สูงสุด 2 แถวต่อวัน

    // ---------- เช็คลิสต์สถานะการส่งงาน (ข้างปฏิทิน, ตั้งแต่ V9.9) ----------
    // เทียบกำหนดการในปฏิทินที่ผูกประเภทงานไว้ กับผลงานที่เคยส่งแล้ว (categoryId+ปี+เทอมตรงกัน = นับว่าส่งแล้ว
    // เป็นเกณฑ์แบบเดียวกับที่หน้าสรุปรวม "สรุปแยกแต่ละงาน" ใช้ — ไม่ได้ผูกกับ eventId เจาะจง เพราะระบบไม่มีฟิลด์นั้นในตาราง submissions)
    // ตั้งแต่ V-ถัดไปหลัง V10.1: แสดงทุกภาคเรียน/ปีการศึกษา จัดเป็นหมวดใหญ่ "เทอม ปีการศึกษา" ก่อน แล้วค่อยลิสงานในเทอมนั้นลงมา (เดิมกรองแสดงแค่เทอมปัจจุบันเทอมเดียว)
    function renderAssignmentChecklist() {
      var wrap = document.getElementById('assignmentChecklistBody');
      if (!wrap) return;
      var assignments = calState.events.filter(function (e) { return !!e.categoryId; });

      if (assignments.length === 0) {
        wrap.innerHTML = '<div class="empty-state" style="padding:16px 4px;">ไม่มีงานที่ต้องส่ง</div>';
        return;
      }
      function isSubmitted(e) {
        return allSubmissions.some(function (s) {
          return s.categoryId === e.categoryId && s.academicYear === e.academicYear && s.semester === e.semester;
        });
      }
      var groups = {}; // key: "ปีการศึกษา|ภาคเรียน"
      assignments.forEach(function (e) {
        var key = e.academicYear + '|' + e.semester;
        if (!groups[key]) groups[key] = { academicYear: e.academicYear, semester: e.semester, rows: [] };
        groups[key].rows.push({ ev: e, done: isSubmitted(e) });
      });
      var groupList = Object.keys(groups).map(function (k) { return groups[k]; });
      groupList.sort(function (a, b) {
        if (a.academicYear !== b.academicYear) return String(b.academicYear).localeCompare(String(a.academicYear));
        return String(b.semester).localeCompare(String(a.semester));
      });

      wrap.innerHTML = groupList.map(function (g) {
        g.rows.sort(function (a, b) {
          if (a.done !== b.done) return a.done ? 1 : -1; // ยังไม่ส่งขึ้นก่อนเสมอ (ต้องรีบทำ)
          return new Date(a.ev.date) - new Date(b.ev.date);
        });
        var semLabel = g.semester === 'summer' ? 'ภาคฤดูร้อน' : 'เทอม ' + escapeHtml(g.semester);
        var rowsHtml = g.rows.map(function (r) {
          var dotColor = categoryColorMap[r.ev.categoryId] || '';
          return '<div class="checklist-item">' +
            '<div class="checklist-mark ' + (r.done ? 'done' : 'pending') + '">' + (r.done ? '✓' : '!') + '</div>' +
            '<div class="checklist-text">' +
              '<div class="checklist-title">' + categoryDotHtml(dotColor) + escapeHtml(r.ev.title) + '</div>' +
              '<div class="checklist-status ' + (r.done ? 'done' : 'pending') + '">' + (r.done ? 'ส่งแล้ว' : 'ยังไม่ส่ง') + '</div>' +
            '</div>' +
          '</div>';
        }).join('');
        return '<div class="checklist-group"><div class="checklist-group-title">' + semLabel + ' ปีการศึกษา ' + escapeHtml(g.academicYear) + '</div>' + rowsHtml + '</div>';
      }).join('');
    }

    function renderCalendar() {
      document.getElementById('calLabel').textContent = thaiMonths[calState.month] + ' ' + (calState.year + 543);
      var grid = document.getElementById('calGrid');
      grid.innerHTML = '';
      thaiDow.forEach(function (d) {
        var el = document.createElement('div'); el.className = 'dow'; el.textContent = d; grid.appendChild(el);
      });
      var firstDay = new Date(calState.year, calState.month, 1).getDay();
      var daysInMonth = new Date(calState.year, calState.month + 1, 0).getDate();
      var todayStr = new Date().toISOString().slice(0, 10);
      var pad2 = function (n) { return String(n).padStart(2, '0'); };
      var monthStartStr = calState.year + '-' + pad2(calState.month + 1) + '-01';
      var monthEndStr = calState.year + '-' + pad2(calState.month + 1) + '-' + pad2(daysInMonth);
      var laneOf = computeEventLanes(calState.events, monthStartStr, monthEndStr);

      for (var i = 0; i < firstDay; i++) {
        var pad = document.createElement('div'); pad.className = 'calendar-cell empty'; grid.appendChild(pad);
      }
      for (var d = 1; d <= daysInMonth; d++) {
        var dateStr = calState.year + '-' + pad2(calState.month + 1) + '-' + pad2(d);
        var isToday = dateStr === todayStr;
        var cell = document.createElement('div');
        cell.className = 'calendar-cell';
        var evs = eventsOnDate(dateStr);
        if (evs.length > 0) { cell.className += ' has-event'; cell.title = evs.map(function (e) { return e.title; }).join(', '); }
        // ตำแหน่งคอลัมน์ (0=อาทิตย์...6=เสาร์) ของวันนี้ในกริด — ใช้ตัดสินว่าต้องแสดงชื่อกำหนดการซ้ำในแถบหรือไม่ (ดูด้านล่าง)
        var colIndex = (firstDay + d - 1) % 7;
        // แถบสีของกำหนดการ (ตั้งแต่ V10.0, ปรับสไตล์ให้เหมือนปฏิทินทั่วไปอีกครั้งตามที่ผู้ใช้ขอ): ลากยาวเต็มความกว้างช่องแบบไร้ขอบ (ชิดขอบซ้าย-ขวาของช่อง)
        // ต่อเนื่องข้ามวันตามช่วงวันที่ (date-endDate) มนหัวเฉพาะวันเริ่ม/วันจบจริงเพื่อให้ดูเป็นแท่งเดียวยาวต่อกัน และแสดง "ชื่อกำหนดการ" เป็นตัวหนังสือในแถบด้วย
        // (แสดงชื่อเฉพาะวันเริ่มต้นจริง หรือวันแรกของแถวใหม่ที่แถบยังลากต่อเนื่องมา ไม่งั้นจะซ้ำทุกวัน) ไม่ผูกประเภทงาน (กำหนดการทั่วไป) ใช้สีเทาอ่อนแทนสีประเภทงาน
        var barsHtml = '';
        evs.slice().sort(function (a, b) { return (laneOf[a.id] || 0) - (laneOf[b.id] || 0); }).forEach(function (e) {
          var lane = laneOf[e.id] || 0;
          if (lane >= MAX_CALENDAR_LANES) return;
          var isStart = dateStr === e.date;
          var isEnd = dateStr === (e.endDate || e.date);
          var showLabel = isStart || colIndex === 0;
          var barColor = e.categoryId ? (categoryColorMap[e.categoryId] || '#3457d5') : '#9aa4b8';
          var cls = 'event-bar' + (isStart ? ' bar-start' : '') + (isEnd ? ' bar-end' : '');
          barsHtml += '<div class="' + cls + '" style="background:' + barColor + ';" title="' + escapeHtml(e.title) + '">' + (showLabel ? escapeHtml(e.title) : '') + '</div>';
        });
        cell.innerHTML = '<div class="day-num' + (isToday ? ' today' : '') + '">' + d + '</div>' + (barsHtml ? '<div class="event-bars">' + barsHtml + '</div>' : '');
        grid.appendChild(cell);
      }

      var upcomingBox = document.getElementById('calEventsUpcoming');
      var now = new Date();
      var upcoming = calState.events.filter(function (e) {
        var ed = new Date(e.endDate || e.date); // ใช้วันสิ้นสุดตัดสินว่ายังไม่ผ่านไป เผื่อเป็นกำหนดการช่วงหลายวัน
        var diffDays = (ed - now) / 86400000;
        return diffDays > -1 && diffDays < 60;
      }).sort(function (a, b) { return new Date(a.date) - new Date(b.date); });

      if (upcoming.length === 0) {
        upcomingBox.innerHTML = '<div class="empty-state">ไม่มีกำหนดการในช่วงนี้</div>';
      } else {
        // ครอบรายการด้วย .cal-upcoming-grid ให้ยาวเต็มความกว้างการ์ด (ตั้งแต่ V10.0) — เรียงลงมาเป็นแถวเดียวตามลำดับวันที่เหมือนเดิม
        // (V10.0 ตอนแรกทำเป็นกริดหลายคอลัมน์ ทำให้ลำดับดูสลับสับสน ผู้ใช้แจ้งว่าเป็นบั๊ก จึงแก้กลับมาเรียงแนวตั้งตามเดิม เหลือแค่ความกว้างที่ยังเต็มการ์ดอยู่)
        // เปลี่ยนชื่อหัวข้อจาก "กำหนดการ" เป็น "กำหนดส่งงาน" และรูปแบบแต่ละแถวเป็น "ชื่อ(ประเภทงาน) เทอม ปีการศึกษา" (ตั้งแต่ V-ถัดไปหลัง V10.1)
        upcomingBox.innerHTML = '<div class="hint" style="margin-bottom:6px;">กำหนดส่งงาน</div><div class="cal-upcoming-grid">' + upcoming.map(function (e) {
          var dateChip = e.endDate && e.endDate !== e.date ? formatDateThai(e.date) + ' – ' + formatDateThai(e.endDate) : formatDateThai(e.date);
          // ปุ่ม "ส่งงาน" ทางขวาสุด เฉพาะกำหนดการที่ผูกกับประเภทงานไว้ (มีอะไรให้ส่งจริง) — กดแล้วเปิดป็อปอัพส่งงานพร้อมเลือกปี/เทอม/ประเภทงานให้อัตโนมัติ
          var submitBtn = e.categoryId
            ? '<button class="btn btn-primary btn-sm event-submit-btn" data-submit-event="' + e.id + '">📤 ส่งงาน</button>'
            : '';
          var termLabel = e.categoryId ? (e.semester === 'summer' ? 'ภาคฤดูร้อน' : 'เทอม ' + escapeHtml(e.semester)) + ' ปีการศึกษา ' + escapeHtml(e.academicYear) : '';
          // ตั้งแต่เวอร์ชันถัดจาก V11.1 หัวข้อกำหนดการที่ผูกประเภทงานจะเป็นชื่อประเภทงานเป๊ะๆ อยู่แล้ว (กรอกเองไม่ได้อีกต่อไป) — ไม่ต้องต่อท้าย "(ชื่อประเภทงาน)" ซ้ำอีกถ้าซ้ำกับหัวข้ออยู่แล้ว (กำหนดการเก่าก่อนอัพเดตที่หัวข้อเคยพิมพ์เองไว้ต่างจากชื่อประเภทงาน ยังโชว์วงเล็บต่อท้ายตามเดิม)
          var showCategorySuffix = e.categoryName && e.categoryName !== e.title;
          return '<div class="event-list-item"><div class="event-date-chip">' + dateChip + '</div>' +
            '<div style="flex:1;"><div class="sub-item-title">' + escapeHtml(e.title) +
              (showCategorySuffix ? ' <span style="font-weight:400; color:var(--text-muted); font-size:0.92em;">(' + escapeHtml(e.categoryName) + ')</span>' : '') + '</div>' +
            (termLabel ? '<div class="sub-item-meta">' + categoryDotHtml(categoryColorMap[e.categoryId]) + escapeHtml(termLabel) + '</div>' : '') +
            (e.message ? '<div class="sub-item-desc">' + escapeHtml(e.message) + '</div>' : '') + '</div>' + submitBtn + '</div>';
        }).join('') + '</div>';
        upcomingBox.querySelectorAll('button[data-submit-event]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var evId = btn.getAttribute('data-submit-event');
            var ev = calState.events.filter(function (e) { return e.id === evId; })[0];
            openUploadModal(ev ? { categoryId: ev.categoryId, academicYear: ev.academicYear, semester: ev.semester } : null);
          });
        });
      }
    }

    document.getElementById('calPrev').addEventListener('click', function () {
      calState.month--; if (calState.month < 0) { calState.month = 11; calState.year--; }
      renderCalendar();
    });
    document.getElementById('calNext').addEventListener('click', function () {
      calState.month++; if (calState.month > 11) { calState.month = 0; calState.year++; }
      renderCalendar();
    });

    document.getElementById('currentTermBadge').textContent = currentTermLabel();
    loadCalendar();
    refreshCategoryColors();

    // ---------- ปุ่มรีเฟรชข้อมูล (บนแท็บด้านบน) ----------
    window.__refreshPageData = function () {
      resetSettingsCache();
      document.getElementById('currentTermBadge').textContent = currentTermLabel();
      return Promise.all([applyBranding(), loadHubAnnouncements(), loadSubmissions(), loadCalendar(), refreshCategoryColors()]);
    };
  </script>
</body>
