<!-- Tailwind CDN ที่เคยฝังไว้ตรงนี้ถูกเอาออกแล้ว (ตั้งแต่ V11.8.3) — สาเหตุที่แท้จริงของปัญหาช่องกรอกข้อมูล "ชิดขอบซ้าย"
     ที่ผู้ใช้แจ้งซ้ำหลายรอบ ยืนยันด้วยเครื่องคอมที่เพิ่งซื้อใหม่ไม่เคยตั้งค่าอะไรก็ยังเป็น + คอนโซล DevTools แสดง
     getComputedStyle(...).paddingLeft = "0px" จริง ทั้งที่ style.css ที่เซิร์ฟเวอร์ส่งออกมาตรงกับซอร์สทุกตัวอักษร:
     สคริปต์ Tailwind CDN ตัวนี้เดิมใส่ไว้แค่ช่วงออกแบบเพื่ออ้างอิงโทนสีเท่านั้น (ไม่มี class ของ Tailwind ใช้งานจริงในเว็บเลย
     สักจุด — เช็คแล้วทั้ง 5 หน้า) แต่ตัว CDN สร้าง Preflight (CSS reset มาตรฐานของ Tailwind ที่ตั้ง padding/border ของ
     input ทุกตัวเป็น 0 เพื่อ "ล้างค่า default ของเบราว์เซอร์") แล้วแทรกสไตล์ของตัวเองเข้า <head> ทีหลัง (browser ประมวลผล
     script แบบ async หลังโหลดเน็ตเวิร์กเสร็จ) ทำให้ชนะลำดับ cascade ทับ padding: 10px 28px ที่ style.css ของเราตั้งไว้
     โดยไม่มีทางแก้จากฝั่ง style.css เองเลย (เพราะ specificity เท่ากัน ผู้มาทีหลังชนะ) — เกิดเฉพาะตอนเน็ตเวิร์กโหลด CDN
     สำเร็จเท่านั้น (อธิบายได้ว่าทำไมตอนแรกผมทดสอบในเครื่องแล้วไม่เจอปัญหา เพราะเครื่องทดสอบบล็อกการเรียก CDN ภายนอกไว้)
     ลบสคริปต์นี้ทิ้งเลยปลอดภัย 100% เพราะไม่มีอะไรในเว็บพึ่งพา class ของ Tailwind อยู่จริง -->

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
  .stat-tile .stat-value { font-size: 1.6rem; font-weight: 700; color: var(--primary-dark); }
  .stat-tile .stat-label { color: var(--text-muted); font-size: 0.8rem; margin-top: 2px; }
  /* สรุปภาพรวมการส่งงานแบบย่อ (คอลัมน์ขวาข้างปฏิทิน) */
  .exec-sum-item { padding: 8px 2px; border-bottom: 1px solid var(--border); }
  .exec-sum-item:last-child { border-bottom: none; }
  .exec-sum-title { font-size: 0.86rem; font-weight: 700; line-height: 1.3; }
  .exec-sum-meta { font-size: 0.74rem; color: var(--text-muted); margin-top: 1px; }
  .exec-bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--border); margin-top: 5px; }
  .exec-bar > span { display: block; height: 100%; }
  .exec-bar .ok { background: var(--accent); }
  .exec-bar .late { background: #f59e0b; }
  .exec-sum-nums { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.74rem; font-weight: 700; margin-top: 4px; }
  .exec-sum-nums .ok { color: var(--accent); } .exec-sum-nums .late { color: #b45309; } .exec-sum-nums .miss { color: var(--danger); }
  .exec-full-btn { margin-top: 10px; width: 100%; }
  /* 1.76: เช็คลิสต์เป็น absolute เต็มกรอบ (จอกว้าง) -> ปุ่มทับหัวข้อ — วางปุ่มไว้ล่างสุดและเว้นที่ให้ */
