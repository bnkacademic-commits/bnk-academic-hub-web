<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- 1.80: PWA — ติดตั้งลงหน้าจอหลัก/คอมได้ (manifest + ไอคอน · sw.js ลงทะเบียนใน api.js) -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0b6fcc" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=2.04.1" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2.04.1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="BNK Academic Hub" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<script>(function(){try{document.documentElement.classList.add('nav-noanim');}catch(e){}})();</script>
<title>คลังรูปภาพกิจกรรม</title>
<link rel="stylesheet" href="assets/fontawesome/css/fontawesome.min.css" />
<link rel="stylesheet" href="assets/fontawesome/css/solid.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css?v=2.10.0.111126" />
<script>(function(){try{var c=localStorage.getItem('bnkah_theme_css_login')||localStorage.getItem('bnkah_theme_css');if(c){var e=document.createElement('style');e.id='bnkahThemeVars';e.textContent=c;document.head.appendChild(e);}}catch(e){}})();</script>
</head>
<body class="pubc-body">
  <!-- 1.76: หน้าสาธารณะ "คลังรูปภาพกิจกรรม" (ไม่ต้องล็อกอิน · ธีมกระดาษขาวเสมอ) — เฉพาะอัลบั้มที่เปิด "แสดงในหน้าสาธารณะ"
       Worker: publicAlbumList (ไม่ส่งชื่อผู้เพิ่ม · 1.85: ต้องมีคำค้น) · ลิงก์มาจากปุ่ม "แชร์หน้าสาธารณะ" ในหน้าคลังรูปภาพ -->
  <div class="topbar pubc-topbar">
    <button class="brand js-home-btn" type="button" tabindex="-1" style="cursor:default;"><span class="js-brand-logo"><span class="logo-dot"></span></span> <span class="js-site-name">BNKAcademicHub</span></button>
    <div class="user-info"><span>คลังรูปภาพกิจกรรม</span></div>
  </div>
  <header class="pubc-hero">
    <div class="pubc-logo"><i class="fa-solid fa-images" aria-hidden="true"></i></div>
    <h1>คลังรูปภาพกิจกรรม</h1>
    <p id="phSub">อัลบั้มภาพกิจกรรมของโรงเรียน</p>
  </header>
  <!-- 2.02.0: อัลบั้มล่าสุด 5 แสดงเสมอ · รายการเริ่มที่ปีการศึกษาปัจจุบัน · 2.01.0: ไล่ดูได้ (อัลบั้มล่าสุด 5 + โหลดเพิ่มทีละ 10) · ค้นหา / กรองปีการศึกษา–ภาคเรียน · เฉพาะอัลบั้มที่เปิดสาธารณะ -->
  <main class="pubc-main ph-main">
    <form class="pubc-search" id="phForm" role="search" autocomplete="off">
      <div class="pubc-sbox">
        <label class="pubc-in"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input id="phSearch" type="search" maxlength="80" placeholder="ค้นหาชื่อกิจกรรม เช่น ศึกษาดูงาน" aria-label="ค้นหาอัลบั้มจากชื่อกิจกรรม" /></label>
        <button type="submit" class="btn btn-primary" id="phGo">ค้นหา</button>
      </div>
    </form>
    <div id="phRoot" aria-live="polite"></div>
  </main>
  <div id="app-footer"></div>
  <script src="assets/api.js?v=2.10.0.111126"></script>
  <script src="assets/gallery.js?v=2.10.0.111126"></script>
  <script>
    mountFooter();
    applyBranding();
    var $ = function (id) { return document.getElementById(id); };
    // 2.02.0: อัลบั้มล่าสุด 5 อัลบั้มแสดงเสมอ (ไม่มีคำค้น) · รายการด้านล่างเริ่มที่ปีการศึกษาปัจจุบัน (เปลี่ยนได้) · โหลดเพิ่มทีละ 10
    var albums = [], hero = [], st = { q: '', year: 'cur', sem: '', video: false, next: 0, more: false, years: [], total: null }, tok = 0;
    function filtersHtml() {
      return '<div class="ph-flt"><select id="phYear" aria-label="ปีการศึกษา"><option value="">ทุกปีการศึกษา</option>' + st.years.map(function (y) { return '<option value="' + escapeHtml(y) + '"' + (st.year === y ? ' selected' : '') + '>ปีการศึกษา ' + escapeHtml(y) + '</option>'; }).join('') + '</select>' +
        '<select id="phSem" aria-label="ภาคเรียน"><option value="">ทุกภาคเรียน</option>' + ['1', '2', '3'].map(function (x) { return '<option value="' + x + '"' + (st.sem === x ? ' selected' : '') + '>' + (x === '3' ? 'ภาคฤดูร้อน' : 'ภาคเรียนที่ ' + x) + '</option>'; }).join('') + '</select>' +
        '<button type="button" class="ph-vid' + (st.video ? ' on' : '') + '" id="phVid" aria-pressed="' + st.video + '"><i class="fa-solid fa-play" aria-hidden="true"></i> มีวิดีโอ</button></div>'; // 2.02.4
    }
    async function load(append) {
      var root = $('phRoot'), my = ++tok, first = st.year === 'cur';
      try { history.replaceState(null, '', location.pathname + (st.q ? '?q=' + encodeURIComponent(st.q) : '')); } catch (e) { /* ไม่เป็นไร */ }
      if (st.q && st.q.replace(/\s/g, '').length < 2) { root.innerHTML = filtersHtml() + '<div class="pubc-empty">กรุณาพิมพ์อย่างน้อย 2 ตัวอักษร</div>'; return; }
      if (!append) { st.next = 0; if (!root.querySelector('.alb-grid')) root.innerHTML = '<div class="loading">กำลังโหลด</div>'; }
      var btn = $('phMore'); if (btn) { btn.disabled = true; btn.textContent = 'กำลังโหลด...'; }
      try {
        var r = await apiCall('publicAlbumList', { q: st.q, year: st.year, semester: st.sem, video: st.video ? 1 : 0, offset: st.next, hero: !append && !hero.length && !st.q ? 1 : 0 });
        if (my !== tok) return;
        if (r.schoolName) $('phSub').textContent = 'ภาพกิจกรรมของ' + r.schoolName;
        if (r.years) st.years = r.years;
        if (first) st.year = r.year || '';
        if (r.hero) hero = r.hero;
        if (!append) albums = [];
        var add = r.items || []; albums = albums.concat(add); st.next = r.nextOffset || albums.length; st.more = !!r.more; if (r.total != null) st.total = r.total;
        render(append ? add : null);
      } catch (e) { if (my === tok) root.innerHTML = '<div class="error-box">' + escapeHtml(e.message) + '</div>'; }
    }
    function listOf(arr) { var hid = {}; if (!st.q && !st.video) hero.forEach(function (a) { hid[a.id] = 1; }); return arr.filter(function (a) { return !hid[a.id]; }); }
    function render(added) {
      var root = $('phRoot');
      if (added && $('phList')) { // โหลดเพิ่ม = ต่อท้ายรายการเดิม (ไม่วาดใหม่ทั้งหน้า)
        var more = listOf(added), tmp = document.createElement('div'); tmp.innerHTML = more.map(function (a) { return albumCardHtml(a, {}); }).join('');
        var list = $('phList'); while (tmp.firstChild) list.appendChild(tmp.firstChild);
        wireAlbumCovers(list); loadManagedCovers(list, more, true); moreBtn(); return;
      }
      var showHero = !st.q && !st.video && hero.length, rest = listOf(albums);
      var label = st.q ? 'ผลการค้นหา' : st.year ? 'อัลบั้มปีการศึกษา ' + escapeHtml(st.year) + (st.sem ? ' ' + (st.sem === '3' ? 'ภาคฤดูร้อน' : 'ภาคเรียนที่ ' + st.sem) : '') : 'อัลบั้มทั้งหมด' + (st.sem ? ' ' + (st.sem === '3' ? 'ภาคฤดูร้อน' : 'ภาคเรียนที่ ' + st.sem) : '');
      // 2.02.4: อัลบั้มล่าสุด = การ์ดใหญ่ 2 (กว้าง 2 ช่อง ชื่อวางบนรูป) + การ์ดปกติ 4 · การ์ดทุกใบสูงเท่ากัน ปกแนวนอน
      root.innerHTML = (showHero ? '<h2 class="ph-h">อัลบั้มล่าสุด</h2><div class="alb-grid ph-fix ph-hero2">' + hero.map(function (a, i) { var h = albumCardHtml(a, {}); return i < 2 ? h.replace('class="alb-card"', 'class="alb-card alb-big"') : h; }).join('') + '</div>' : '') +
        '<h2 class="ph-h ph-h2">' + label + (st.total != null ? ' <small>(' + st.total + ' อัลบั้ม)</small>' : '') + '</h2>' + filtersHtml() +
        (rest.length ? '<div class="alb-grid ph-fix ph-list" id="phList">' + rest.map(function (a) { return albumCardHtml(a, {}); }).join('') + '</div>' :
          '<div class="pubc-empty"><i class="fa-solid fa-images" aria-hidden="true"></i> ' + (st.q ? 'ไม่พบอัลบั้มที่ตรงกับ "' + escapeHtml(st.q) + '"<div class="hint">ลองพิมพ์คำอื่น หรือพิมพ์เพียงบางส่วนของชื่อกิจกรรม</div>' : (albums.length ? 'อัลบั้มของช่วงนี้แสดงอยู่ในอัลบั้มล่าสุดด้านบนแล้ว' : 'ยังไม่มีอัลบั้มในช่วงนี้ — ลองเลือกปีการศึกษาอื่น')) + '</div>') +
        '<div class="ph-more-wrap" id="phMoreWrap"></div>';
      wireAlbumCovers(root); loadManagedCovers(root, (showHero ? hero : []).concat(rest), true); moreBtn();
    }
    function moreBtn() { var w = $('phMoreWrap'); if (w) w.innerHTML = st.more ? '<button type="button" class="btn btn-secondary" id="phMore">โหลดเพิ่มอีก 10 อัลบั้ม</button>' : ''; }
    $('phForm').addEventListener('submit', function (e) { e.preventDefault(); st.q = $('phSearch').value.replace(/\s+/g, ' ').trim(); load(false); });
    $('phSearch').addEventListener('input', function () { if (!this.value.trim() && st.q) { st.q = ''; load(false); } });
    $('phRoot').addEventListener('change', function (e) { if (e.target.id === 'phYear') { st.year = e.target.value; load(false); } else if (e.target.id === 'phSem') { st.sem = e.target.value; load(false); } });
    $('phRoot').addEventListener('click', function (e) {
      if (e.target.closest('#phMore')) { load(true); return; }
      if (e.target.closest('#phVid')) { st.video = !st.video; load(false); return; } // 2.02.4
      var card = e.target.closest('[data-alb]'); if (!card || !e.target.closest('[data-alb-copy]')) return;
      var a = albums.concat(hero).filter(function (x) { return x.id === card.getAttribute('data-alb'); })[0];
      if (a) copyAlbumText(a);
    });
    getSiteSettings().then(function (s0) { var n = (s0 && s0.schoolName) || ''; if (n) $('phSub').textContent = 'ภาพกิจกรรมของ' + n; }).catch(function () {});
    st.q = new URLSearchParams(location.search).get('q') || ''; $('phSearch').value = st.q;
    load(false);
  </script>
</body>
</html>
