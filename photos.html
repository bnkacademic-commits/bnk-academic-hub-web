<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- 1.80: PWA — ติดตั้งลงหน้าจอหลัก/คอมได้ (manifest + ไอคอน · sw.js ลงทะเบียนใน api.js) -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0b6fcc" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="BNK Hub" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<script>(function(){try{document.documentElement.classList.add('nav-noanim');}catch(e){}})();</script>
<title>คลังรูปภาพกิจกรรม</title>
<link rel="stylesheet" href="assets/fontawesome/css/fontawesome.min.css" />
<link rel="stylesheet" href="assets/fontawesome/css/solid.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css?v=1.80.0.181026" />
<script>(function(){try{var c=localStorage.getItem('bnkah_theme_css_login')||localStorage.getItem('bnkah_theme_css');if(c){var e=document.createElement('style');e.id='bnkahThemeVars';e.textContent=c;document.head.appendChild(e);}}catch(e){}})();</script>
</head>
<body class="pubc-body">
  <!-- 1.76: หน้าสาธารณะ "คลังรูปภาพกิจกรรม" (ไม่ต้องล็อกอิน · ธีมกระดาษขาวเสมอ) — เฉพาะอัลบั้มที่เปิด "แสดงในหน้าสาธารณะ"
       Worker: publicAlbumList (ไม่ส่งชื่อผู้เพิ่ม) · ลิงก์มาจากปุ่ม "แชร์หน้าสาธารณะ" ในหน้าคลังรูปภาพ -->
  <div class="topbar pubc-topbar">
    <button class="brand js-home-btn" type="button" tabindex="-1" style="cursor:default;"><span class="js-brand-logo"><span class="logo-dot"></span></span> <span class="js-site-name">BNKAcademicHub</span></button>
    <div class="user-info"><span>คลังรูปภาพกิจกรรม</span></div>
  </div>
  <header class="pubc-hero">
    <div class="pubc-logo"><i class="fa-solid fa-images" aria-hidden="true"></i></div>
    <h1>คลังรูปภาพกิจกรรม</h1>
    <p id="phSub">ภาพกิจกรรมของโรงเรียน</p>
  </header>
  <main class="container" style="max-width:1280px; padding-top:20px;">
    <div class="flt" id="phFlt">
      <input type="search" class="flt-q" id="phSearch" placeholder="ค้นหาชื่อกิจกรรม" aria-label="ค้นหา" />
      <button type="button" class="flt-toggle" aria-haspopup="dialog"><i class="fa-solid fa-sliders" aria-hidden="true"></i> ตัวกรอง <span class="flt-n" hidden></span></button>
      <div class="flt-backdrop"></div>
      <div class="flt-panel" role="group" aria-label="ตัวกรอง">
        <div class="flt-head"><span><i class="fa-solid fa-sliders" aria-hidden="true"></i> ตัวกรอง</span><button type="button" class="modal-close-x flt-x" aria-label="ปิด">✕</button></div>
        <label class="flt-f"><span>ปีการศึกษา</span><select id="phYear" aria-label="ปีการศึกษา"><option value="">ทุกปีการศึกษา</option></select></label>
        <label class="flt-f"><span>ภาคเรียน</span><select id="phSem" aria-label="ภาคเรียน"><option value="">ทุกภาคเรียน</option><option value="1">ภาคเรียนที่ 1</option><option value="2">ภาคเรียนที่ 2</option><option value="summer">ภาคฤดูร้อน</option></select></label>
        <label class="flt-f"><span>กลุ่ม</span><select id="phGroup" aria-label="กลุ่มบริหารงาน / กลุ่มสาระการเรียนรู้"><option value="">ทุกกลุ่ม</option></select></label>
        <div class="flt-acts"><button type="button" class="btn btn-close flt-clear" hidden><i class="fa-solid fa-xmark" aria-hidden="true"></i> ล้างตัวกรอง</button><button type="button" class="btn btn-success flt-done">แสดงผล</button></div>
      </div>
    </div>
    <div class="flt-chips" id="phFltChips"></div>
    <div class="flt-meta"><span class="flt-count" id="phFltCount"></span><span class="year-scope-hint" id="phYearHint" hidden></span></div>
    <div id="phRoot"><div class="loading">กำลังโหลด</div></div>
  </main>
  <div id="app-footer"></div>
  <script src="assets/api.js?v=1.80.0.181026"></script>
  <script src="assets/gallery.js?v=1.80.0.181026"></script>
  <script>
    mountFooter();
    applyBranding();
    var $ = function (id) { return document.getElementById(id); };
    var albums = [], shown = GALLERY_PAGE, initYear = '', curYear = '';
    var fltBar = initFilterBar('phFlt', { unit: 'อัลบั้ม', defaults: function () { return { phYear: curYear, phSem: '', phGroup: '' }; } });
    async function load() {
      try {
        var cur = initYear || $('phYear').value; initYear = '';
        var r = await apiCall('publicAlbumList', { year: cur });
        albums = r.items || [];
        var ys = (r.years || []).slice(); if (cur && ys.indexOf(cur) === -1) { ys.push(cur); ys.sort().reverse(); }
        $('phYear').innerHTML = '<option value="">ทุกปีการศึกษา</option>' + ys.map(function (y) { return '<option value="' + y + '"' + (y === cur ? ' selected' : '') + '>ปีการศึกษา ' + y + '</option>'; }).join('');
        var depts = Array.from(new Set(albums.map(function (a) { return a.department; }).filter(Boolean)));
        var subs = Array.from(new Set(albums.map(function (a) { return a.subjectGroup; }).filter(Boolean)));
        var cg = $('phGroup').value;
        $('phGroup').innerHTML = groupFilterOptions(depts, subs, false);
        $('phGroup').value = cg; if ($('phGroup').value !== cg) $('phGroup').value = '';
        if (r.schoolName) $('phSub').textContent = 'ภาพกิจกรรมของ' + r.schoolName;
      } catch (e) { $('phRoot').innerHTML = '<div class="error-box">' + escapeHtml(e.message) + '</div>'; return; }
      render();
    }
    function render() {
      var list = filterAlbums(albums, { q: $('phSearch').value, semester: $('phSem').value, group: $('phGroup').value });
      var root = $('phRoot');
      var hint = $('phYearHint'); hint.hidden = !($('phSearch').value.trim() && $('phYear').value);
      if (!hint.hidden) hint.innerHTML = '<i class="fa-solid fa-circle-info"></i> ค้นหาเฉพาะปีการศึกษา ' + escapeHtml($('phYear').value) + ' — <button type="button" id="phSearchAllYears">ค้นหาทุกปีการศึกษา</button>';
      fltBar.update(list.length);
      if (!list.length) { root.innerHTML = '<div class="card"><div class="empty-state">' + (albums.length ? 'ไม่พบอัลบั้มที่ตรงกับตัวกรอง' : 'ยังไม่มีอัลบั้มที่เผยแพร่') + '</div></div>'; return; }
      root.innerHTML = '<div class="alb-grid">' + list.slice(0, shown).map(function (a) { return albumCardHtml(a, {}); }).join('') + '</div>' +
        (list.length > shown ? '<div class="list-more"><button type="button" class="btn btn-secondary btn-sm" id="phMore">แสดงเพิ่ม (' + (list.length - shown) + ')</button></div>' : '');
      wireAlbumCovers(root);
    }
    $('phSearch').addEventListener('input', function () { shown = GALLERY_PAGE; render(); });
    $('phYearHint').addEventListener('click', function (e) { if (e.target.closest('#phSearchAllYears')) { $('phYear').value = ''; shown = GALLERY_PAGE; load(); } });
    ['phSem', 'phGroup'].forEach(function (id) { $(id).addEventListener('change', function () { shown = GALLERY_PAGE; render(); }); });
    $('phYear').addEventListener('change', function () { shown = GALLERY_PAGE; load(); });
    $('phRoot').addEventListener('click', function (e) {
      if (e.target.closest('#phMore')) { shown += GALLERY_PAGE; render(); return; }
      var card = e.target.closest('[data-alb]'); if (!card || !e.target.closest('[data-alb-copy]')) return;
      var a = albums.filter(function (x) { return x.id === card.getAttribute('data-alb'); })[0];
      if (a) copyAlbumText(a);
    });
    // ค่าเริ่มต้น = ปีการศึกษาปัจจุบัน
    (async function () {
      try { var term = await currentAcademicTerm(); initYear = curYear = String(term.year); } catch (e) { /* ทุกปี */ } // 1.79: ปีการศึกษาปัจจุบัน + ทุกภาคเรียน
      load();
    })();
  </script>
</body>
</html>
