<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<script>(function(){try{var t=localStorage.getItem('bnkah_theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');if(localStorage.getItem('bnkah_memo_off')==='1')document.documentElement.classList.add('memo-off');}catch(e){}})();</script>
<title>คลังเกียรติบัตร — BNKAcademicHub</title>
<link rel="stylesheet" href="assets/fontawesome/css/fontawesome.min.css" />
<link rel="stylesheet" href="assets/fontawesome/css/solid.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css?v=1.61.131026" />
<!-- 1.56: ธีมสีจากค่าที่จำไว้ (ใส่หลัง style.css ให้ทับค่าเริ่มต้น) — ดู applyThemeColor ใน api.js -->
<script>(function(){try{var c=localStorage.getItem('bnkah_theme_css');if(c){var e=document.createElement('style');e.id='bnkahThemeVars';e.textContent=c;document.head.appendChild(e);}}catch(e){}})();</script>
</head>
<body>
  <!-- คลังเกียรติบัตร (1.59, ปรับเป็นรายใบใน 1.60): 2 แท็บ ภายใน/ภายนอก · ปุ่มเพิ่มแยกภายใน (รันเลขที่ + จองเลขก่อนอัพไฟล์ได้) / ภายนอก (ต้องมีไฟล์ครบ)
       1 ชุด = 1 กิจกรรม มีได้หลายรายการแข่งขัน (แต่ละรายการมีรางวัล + ผู้ได้รับ) · 1 คน = 1 ไฟล์ · แชร์ลิงก์หน้าค้นหาสาธารณะ certificate.html
       ทุกบัญชีดูได้ · ครู/เจ้าหน้าที่เพิ่มได้ · แก้ไข/ลบ: เจ้าของ + เจ้าหน้าที่ — ดู worker/src/handlers/certs.js -->
  <div id="app-topbar"></div>
  <div class="container">
    <div class="page-header orders-header">
      <div>
        <h1><i class="fa-solid fa-award cert-h-ic" aria-hidden="true"></i> คลังเกียรติบัตร</h1>
        <p id="certSubtitle">เกียรติบัตรของครู นักเรียน และโรงเรียน</p>
      </div>
      <div class="cert-head-btns">
        <button type="button" class="btn cert-share-btn" id="certShareAllBtn"><i class="fa-solid fa-share-nodes"></i> แชร์หน้าค้นหา</button>
        <!-- 1.61: ปุ่มเพิ่ม 2 ปุ่มเด่นเท่ากัน แยกสีตายตัว (ภายนอก = เขียว · ภายใน = ส้ม) ไม่เปลี่ยนตามธีมสีของระบบ -->
        <button type="button" class="cert-add-card ext" id="certAddExtBtn" hidden><span class="ic"><i class="fa-solid fa-earth-asia"></i></span><span><b>เพิ่มเกียรติบัตรภายนอก</b><small>แนบไฟล์ให้ครบทุกคน</small></span></button>
        <button type="button" class="cert-add-card int" id="certAddIntBtn" hidden><span class="ic"><i class="fa-solid fa-school"></i></span><span><b>เพิ่มเกียรติบัตรภายใน</b><small>รันเลขที่ให้อัตโนมัติ</small></span></button>
      </div>
    </div>
    <div class="cert-alert" id="certPendingAlert" hidden></div>
    <div class="cert-tabs" role="tablist" id="certTabs">
      <button type="button" role="tab" data-scope="internal"><i class="fa-solid fa-school"></i> ภายในโรงเรียน <b class="n" id="certCntInternal">0</b></button>
      <button type="button" role="tab" data-scope="external"><i class="fa-solid fa-earth-asia"></i> ภายนอกโรงเรียน <b class="n" id="certCntExternal">0</b></button>
    </div>
    <div class="cert-toolbar">
      <div class="cert-kind-seg" role="group" aria-label="ประเภทเกียรติบัตร" id="certKindSeg">
        <button type="button" data-kind="" class="on">ทั้งหมด</button><button type="button" data-kind="teacher">ครู</button><button type="button" data-kind="student">นักเรียน</button><button type="button" data-kind="school">โรงเรียน</button>
      </div>
      <input type="search" id="certSearch" placeholder="ค้นหาชื่อกิจกรรม / รายการแข่งขัน / ชื่อผู้ได้รับ / เลขที่ / รางวัล" />
    </div>
    <div class="cert-toolbar">
      <select id="certActivity" aria-label="กรองตามกิจกรรม" class="grow"></select>
      <button type="button" class="btn btn-ghost btn-sm cert-merge-btn" id="certMergeBtn" hidden title="รวมชื่อกิจกรรมที่พิมพ์ต่างกันให้เป็นชื่อเดียว"><i class="fa-solid fa-code-merge"></i> จัดการชื่อกิจกรรม</button>
      <select id="certYear" aria-label="กรองตามปีการศึกษา"></select>
      <select id="certSem" aria-label="กรองตามภาคเรียน"></select>
      <select id="certMine" aria-label="กรองตามความเกี่ยวข้อง">
        <option value="">ทุกเกียรติบัตร</option>
        <option value="mine">ที่ฉันเพิ่ม</option>
        <option value="recv">ที่ฉันได้รับ</option>
        <option value="pending">ยังอัพไฟล์ไม่ครบ</option>
        <option value="cancelled">ที่ยกเลิกแล้ว</option>
      </select>
    </div>
    <div id="certRoot"><div class="loading">กำลังโหลด...</div></div>
  </div>

  <!-- เพิ่ม/แก้ไขเกียรติบัตร (ภายใน/ภายนอก ใช้ป็อปอัพเดียวกัน) -->
  <div class="modal-backdrop" id="certModal" hidden>
    <div class="modal-box modal-box-wide cert-modal">
      <button type="button" class="modal-close-x" id="certCloseX" aria-label="ปิด">✕</button>
      <h3 id="certModalTitle"></h3>
      <p class="hint" id="certModalSub" style="margin-top:-6px;"></p>
      <div id="certError" class="error-box" hidden></div>
      <form id="certForm" style="text-align:left;" novalidate autocomplete="off">
        <div class="field-row cert-row3">
          <div class="field"><label for="certFSem">ภาคเรียน</label><select id="certFSem"></select></div>
          <div class="field"><label for="certFYear">ปีการศึกษา</label><input id="certFYear" maxlength="4" inputmode="numeric" placeholder="2569" /></div>
          <div class="field"><label for="certFDate">วันที่ตามเกียรติบัตร <span class="hint date-thai" id="certFDateThai"></span></label><input id="certFDate" type="date" /></div>
        </div>
        <div class="field">
          <label>ประเภทเกียรติบัตร</label>
          <div class="cert-kind-pick" id="certFKind" role="radiogroup">
            <button type="button" data-kind="teacher" role="radio"><i class="fa-solid fa-chalkboard-user"></i> ครู</button>
            <button type="button" data-kind="student" role="radio"><i class="fa-solid fa-user-graduate"></i> นักเรียน</button>
            <button type="button" data-kind="school" role="radio"><i class="fa-solid fa-school"></i> โรงเรียน</button>
          </div>
        </div>
        <div class="field cert-ac-wrap">
          <label for="certFActivity">ชื่อกิจกรรม</label>
          <input id="certFActivity" maxlength="200" placeholder="เช่น การแข่งขันศิลปหัตถกรรมนักเรียน ครั้งที่ 72" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="certActList" />
          <div class="cert-ac" id="certActList" role="listbox" hidden></div>
          <div class="cert-similar" id="certSimilar" hidden></div>
        </div>
        <div class="cert-comp-tg" id="certCompTg" role="radiogroup" aria-label="รายการแข่งขัน">
          <button type="button" role="radio" data-comp="0"><i class="rd" aria-hidden="true"></i><span><b>ไม่มีรายการแข่งขัน</b><small>เช่น ค่าย อบรม เข้าร่วมกิจกรรม</small></span></button>
          <button type="button" role="radio" data-comp="1"><i class="rd" aria-hidden="true"></i><span><b>มีรายการแข่งขัน</b><small>แยกรายการ/รางวัลได้หลายรายการ</small></span></button>
        </div>
        <div id="certGroups"></div>
        <button type="button" class="cert-add-grp" id="certAddGroup"><i class="fa-solid fa-plus"></i> เพิ่มรายการแข่งขัน</button>
        <div class="cert-note" id="certModalNote"></div>
        <datalist id="certCompDL"></datalist>
        <datalist id="certAwardDL"></datalist>
        <input id="certPickFile" type="file" accept="application/pdf,.pdf,image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" hidden />
        <input id="certPickMulti" type="file" accept="application/pdf,.pdf,image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" multiple hidden />
        <div class="modal-actions">
          <span class="cert-missing" id="certMissing" hidden></span>
          <button type="submit" class="btn btn-primary" id="certSaveBtn"></button>
          <button type="button" class="btn btn-ghost" id="certCancel">ยกเลิก</button>
        </div>
      </form>
    </div>
  </div>

  <!-- แชร์ลิงก์หน้าค้นหา (ทั้งหมด / ตามกิจกรรม) -->
  <div class="modal-backdrop" id="certShareModal" hidden>
    <div class="modal-box modal-box-wide cert-share-box">
      <button type="button" class="modal-close-x" id="certShareCloseX" aria-label="ปิด">✕</button>
      <h3 id="certShareTitle"></h3>
      <p class="hint" id="certShareSub" style="margin-top:-6px;"></p>
      <div class="cert-share">
        <div class="cert-share-main">
          <label class="cert-share-lb">ลิงก์</label>
          <div class="cert-share-link"><i class="fa-solid fa-link" aria-hidden="true"></i><span id="certShareLink"></span>
            <button type="button" class="btn btn-primary btn-sm" id="certShareCopy"><i class="fa-solid fa-copy"></i> คัดลอก</button></div>
          <div class="cert-share-btns">
            <button type="button" class="btn btn-secondary btn-sm" id="certShareEmbed"><i class="fa-solid fa-code"></i> คัดลอกโค้ดฝังเว็บไซต์</button>
            <a class="btn btn-ghost btn-sm" id="certShareOpen" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> เปิดดู</a>
          </div>
          <p class="hint" id="certShareHint"></p>
        </div>
        <div class="cert-share-qr">
          <div id="certShareQr"></div>
          <button type="button" class="btn btn-secondary btn-sm" id="certShareQrDl"><i class="fa-solid fa-download"></i> ดาวน์โหลด QR</button>
          <div class="hint">สำหรับติดประกาศ</div>
        </div>
      </div>
      <div class="modal-actions"><button type="button" class="btn btn-ghost" id="certShareClose">ปิด</button></div>
    </div>
  </div>

  <!-- จัดการชื่อกิจกรรม (รวมชื่อที่พิมพ์ต่างกันให้เป็นชื่อเดียว) — เจ้าหน้าที่ -->
  <div class="modal-backdrop" id="certMergeModal" hidden>
    <div class="modal-box modal-box-wide">
      <button type="button" class="modal-close-x" id="certMergeCloseX" aria-label="ปิด">✕</button>
      <h3><i class="fa-solid fa-code-merge" aria-hidden="true"></i> จัดการชื่อกิจกรรม</h3>
      <p class="hint" style="margin-top:-6px;">ติ๊กชื่อกิจกรรมที่เป็นกิจกรรมเดียวกัน แล้วเลือก/พิมพ์ชื่อที่ถูกต้อง — เกียรติบัตรทุกใบที่ใช้ชื่อที่ติ๊กจะเปลี่ยนเป็นชื่อนี้ (ชื่อไฟล์ใน Google Drive คงเดิม)</p>
      <div id="certMergeError" class="error-box" hidden></div>
      <input type="search" id="certMergeSearch" placeholder="ค้นหาชื่อกิจกรรม" />
      <div class="cert-merge-list" id="certMergeList"></div>
      <div class="field" style="margin-top:10px; text-align:left;">
        <label for="certMergeTo">รวมเป็นชื่อ</label>
        <input id="certMergeTo" maxlength="200" placeholder="กดชื่อด้านบนเพื่อใช้เป็นชื่อหลัก หรือพิมพ์ใหม่" />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-primary" id="certMergeSave" disabled><i class="fa-solid fa-code-merge"></i> รวมเป็นชื่อเดียว</button>
        <button type="button" class="btn btn-ghost" id="certMergeCancel">ปิด</button>
      </div>
    </div>
  </div>
  <input id="certItemFile" type="file" accept="application/pdf,.pdf,image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" hidden />

  <div id="app-footer"></div>
  <script src="assets/api.js?v=1.61.131026"></script>
  <script src="assets/qrcode.min.js"></script>
  <script>
    var session = requireLogin();
    var certs = [], activities = [], people = [], me = null, canAdd = false, canMerge = false, schoolName = '', summerOn = true;
    var numbering = { format: 'บนค. {ปีการศึกษา}/{เลขที่}', digits: 4, counters: {} };
    var scope = 'internal', kindFilter = '', expanded = {}, curTerm = null, yearDefaulted = false;
    var TAB_KEY = 'bnkah_cert_tab';
    var AWARD_SUGG = ['ชนะเลิศ', 'รองชนะเลิศอันดับ 1', 'รองชนะเลิศอันดับ 2', 'เหรียญทอง', 'เหรียญเงิน', 'เหรียญทองแดง', 'ชมเชย', 'เข้าร่วม'];
    var KIND_LABEL = { teacher: 'ครู', student: 'นักเรียน', school: 'โรงเรียน' };
    var KIND_ICON = { teacher: 'fa-chalkboard-user', student: 'fa-user-graduate', school: 'fa-school' };
    var TH_MONTH_ABBR = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
    function $(id) { return document.getElementById(id); }
    function semText(s) { return s === 'summer' ? 'ภาคฤดูร้อน' : 'ภาคเรียนที่ ' + s; }
    function showErr(msg) { var e = $('certError'); e.textContent = msg || ''; e.hidden = !msg; if (msg) e.scrollIntoView({ block: 'nearest' }); }
    function publicBase() { return location.origin + location.pathname.replace(/[^\/]*$/, '') + 'certificate.html'; }
    try { var savedTab = localStorage.getItem(TAB_KEY); if (savedTab === 'external' || savedTab === 'internal') scope = savedTab; } catch (e) { /* ใช้ค่าเริ่มต้น */ }

    // ---------- ชื่อกิจกรรมคล้ายกัน (กันพิมพ์ต่างกัน) ----------
    function normName(s) { return String(s || '').toLowerCase().replace(/[\s.,\-_()"'“”:;\/]+/g, ''); }
    function editDistance(a, b) {
      if (a === b) return 0;
      var m = a.length, n = b.length, prev = [], cur = [], i, j;
      for (j = 0; j <= n; j++) prev[j] = j;
      for (i = 1; i <= m; i++) {
        cur = [i];
        for (j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a.charCodeAt(i - 1) === b.charCodeAt(j - 1) ? 0 : 1));
        prev = cur;
      }
      return prev[n];
    }
    function similarActivities(typed) {
      var t = normName(typed);
      if (t.length < 4) return [];
      if (activities.some(function (a) { return a.name === typed.replace(/\s+/g, ' ').trim(); })) return [];
      return activities.map(function (a) {
        var n = normName(a.name);
        if (n === t) return { a: a, score: 1 };
        var d = editDistance(t, n), score = 1 - d / Math.max(t.length, n.length);
        if ((n.indexOf(t) !== -1 || t.indexOf(n) !== -1) && Math.min(t.length, n.length) / Math.max(t.length, n.length) >= 0.6) score = Math.max(score, 0.85);
        return { a: a, score: score };
      }).filter(function (x) { return x.score >= 0.7; }).sort(function (x, y) { return y.score - x.score || y.a.count - x.a.count; }).slice(0, 3).map(function (x) { return x.a; });
    }

    // ---------- ข้อมูลช่วย ----------
    function activeItems(c) { return (c.items || []).filter(function (it) { return it.status === 'active'; }); }
    function missingCount(c) { return c.status === 'cancelled' ? 0 : activeItems(c).filter(function (it) { return !it.file; }).length; }
    function groupsOf(c, includeCancelled) {
      var gs = [], by = {};
      (c.items || []).forEach(function (it) {
        if (!includeCancelled && it.status !== 'active') return;
        if (!by[it.grp]) { by[it.grp] = { grp: it.grp, competition: it.competition, award: it.award, items: [] }; gs.push(by[it.grp]); }
        by[it.grp].items.push(it);
      });
      return gs.sort(function (a, b) { return a.grp - b.grp; });
    }
    function itemsText(c) { return (c.items || []).map(function (it) { return it.name + ' ' + it.cls + ' ' + it.certNo + ' ' + it.competition + ' ' + it.award; }).join(' '); }

    // ---------- ตัวกรอง ----------
    function fillFilters() {
      var a = $('certActivity'), y = $('certYear'), s = $('certSem');
      var av = a.value, yv = y.value, sv = s.value;
      if (!yearDefaulted && curTerm && curTerm.year) { yv = String(curTerm.year); yearDefaulted = true; }
      var acts = {};
      certs.filter(function (c) { return c.scope === scope && c.status !== 'cancelled'; }).forEach(function (c) { acts[c.activity] = (acts[c.activity] || 0) + 1; });
      a.innerHTML = '<option value="">ทุกกิจกรรม</option>' + Object.keys(acts).sort(function (p, q) { return acts[q] - acts[p] || p.localeCompare(q, 'th'); })
        .map(function (k) { return '<option value="' + escapeHtml(k) + '">' + escapeHtml(k) + ' (' + acts[k] + ')</option>'; }).join('');
      var years = {};
      certs.forEach(function (c) { years[c.academicYear] = 1; });
      if (curTerm && curTerm.year) years[curTerm.year] = 1;
      y.innerHTML = '<option value="">ทุกปีการศึกษา</option>' + Object.keys(years).filter(Boolean).sort(function (p, q) { return q - p; }).map(function (k) { return '<option value="' + k + '">ปีการศึกษา ' + k + '</option>'; }).join('');
      s.innerHTML = '<option value="">ทุกภาคเรียน</option><option value="1">ภาคเรียนที่ 1</option><option value="2">ภาคเรียนที่ 2</option>' + (summerOn ? '<option value="summer">ภาคฤดูร้อน</option>' : '');
      a.value = av; if (a.value !== av) a.value = '';
      y.value = yv; if (y.value !== yv) y.value = '';
      s.value = sv; if (s.value !== sv) s.value = '';
    }
    function renderTabs() {
      Array.prototype.forEach.call(document.querySelectorAll('#certTabs button'), function (b) { var on = b.getAttribute('data-scope') === scope; b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); });
      $('certCntInternal').textContent = certs.filter(function (c) { return c.scope === 'internal' && c.status !== 'cancelled'; }).length;
      $('certCntExternal').textContent = certs.filter(function (c) { return c.scope === 'external' && c.status !== 'cancelled'; }).length;
      Array.prototype.forEach.call(document.querySelectorAll('#certKindSeg button'), function (b) { b.classList.toggle('on', b.getAttribute('data-kind') === kindFilter); });
    }
    // แจ้งเตือน: เกียรติบัตรของฉันที่จองเลข/บันทึกแล้วแต่ยังอัพไฟล์ไม่ครบ
    function renderPendingAlert() {
      var mine = certs.filter(function (c) { return c.isOwner && missingCount(c) > 0; });
      var el = $('certPendingAlert');
      if (!mine.length) { el.hidden = true; el.innerHTML = ''; return; }
      var n = mine.reduce(function (s, c) { return s + missingCount(c); }, 0);
      el.innerHTML = '<i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i><div><b>มี ' + mine.length + ' รายการของคุณที่ยังอัพไฟล์ไม่ครบ</b> (ขาด ' + n + ' ไฟล์) — กดที่รายการแล้วกด "อัพไฟล์" ท้ายชื่อแต่ละคน</div>' +
        '<button type="button" class="btn btn-sm cert-alert-btn" id="certPendingShow">ดูเฉพาะรายการนี้</button>';
      el.hidden = false;
    }

    // ---------- รายการ ----------
    function iReceived(c) { return c.kind === 'teacher' && activeItems(c).some(function (it) { return it.userId === session.id; }); }
    function render() {
      renderTabs(); renderPendingAlert();
      var q = $('certSearch').value.trim().toLowerCase();
      var fa = $('certActivity').value, fy = $('certYear').value, fsem = $('certSem').value, fm = $('certMine').value;
      var list = certs.filter(function (c) {
        if (c.scope !== scope) return false;

    // ----- ไฟล์ -----
    function okFile(f) { return /\.(pdf|jpe?g|png|webp)$/i.test(f.name) && (!f.type || /^(application\/pdf|image\/(jpeg|png|webp))$/.test(f.type)); }
    function checkFile(f) {
      if (!okFile(f)) return '"' + f.name + '" ไม่ใช่ไฟล์ PDF/รูปภาพ (JPG/PNG/WEBP)';
      if (f.size > 25 * 1024 * 1024) return '"' + f.name + '" ใหญ่เกิน 25MB';
      return '';
    }
    function mimeOf(f) { return f.type || (/\.png$/i.test(f.name) ? 'image/png' : /\.webp$/i.test(f.name) ? 'image/webp' : /\.jpe?g$/i.test(f.name) ? 'image/jpeg' : 'application/pdf'); }
    async function uploadToRelay(file, prep) {
      var base64 = await fileToBase64(file), text;
      try {
        var r = await fetch(prep.relayUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ uploadToken: prep.uploadToken, base64: base64, filename: prep.uploadFileName || file.name, mimeType: mimeOf(file) }) });
        text = await r.text();
      } catch (e) { throw new Error('ติดต่อระบบเก็บไฟล์ไม่สำเร็จ (เครือข่ายขัดข้อง) กรุณาลองใหม่อีกครั้ง'); }
      var j; try { j = JSON.parse(text); } catch (e) { throw new Error('ระบบเก็บไฟล์ตอบกลับข้อมูลไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง'); }
      if (!j.ok) throw new Error(j.error || 'อัพโหลดไฟล์ไม่สำเร็จ');
      return j.data;
    }
    // jobs = [{itemId, file, label}] — อัพทีละไฟล์ คืนรายการที่ไม่สำเร็จ
    async function uploadJobs(certId, jobs, p, log, from) {
      var failed = [], base = from || 0, seg = (100 - base) / Math.max(1, jobs.length);
      for (var i = 0; i < jobs.length; i++) {
        var j = jobs[i], s0 = base + i * seg, head = (jobs.length > 1 ? (i + 1) + '/' + jobs.length + ': ' : '') + j.label;
        try {
          p.setProgress(s0 + seg * 0.02, 'กำลังเตรียม ' + head);
          var fp = await apiCall('certItemFilePrepare', { certId: certId, itemId: j.itemId, fileName: j.file.name, mimeType: mimeOf(j.file), fileSize: j.file.size });
          p.creep(s0 + seg * 0.08, s0 + seg * 0.9, estimateUploadMs(j.file.size), 'กำลังอัพโหลดไฟล์ของ ' + head + ' (' + formatBytes(j.file.size) + ')');
          var u = await uploadToRelay(j.file, fp);
          p.setProgress(s0 + seg * 0.94, 'กำลังบันทึก ' + head);
          await apiCall('certItemFileFinalize', { certId: certId, itemId: j.itemId, fileId: u.fileId, fileUrl: u.url, directUrl: u.directUrl, originalName: j.file.name, mimeType: mimeOf(j.file), log: !!log });
        } catch (err) { failed.push(j.label + ': ' + (err && err.message)); }
        p.setProgress(s0 + seg);
      }
      return failed;
    }

    function payloadGroups() {

        var ps = g.people.filter(personFilled);

          people: ps.map(function (p) { return { id: p.id || '', name: (p.name || '').trim(), cls: (p.cls || '').trim(), userId: p.userId || '' }; }) };
      });
      return { groups: gs, flat: flat };

    async function onSubmit(ev) {

        if (miss) return showErr('เกียรติบัตรภายนอกต้องแนบไฟล์ให้ครบทุกคน — ยังขาด ' + miss + ' คน (กด "เลือกไฟล์" ท้ายชื่อ)');

        p.setProgress(1, sc === 'internal' && !wasEdit ? 'กำลังจองเลขที่เกียรติบัตร' : 'กำลังบันทึกข้อมูล');

    function copyText(t, okMsg) {
      try { navigator.clipboard.writeText(t).then(function () { showToast(okMsg); }, function () { showToast('คัดลอกไม่สำเร็จ ลองคัดลอกด้วยตนเอง', true); }); }
      catch (e) { showToast('คัดลอกไม่สำเร็จ ลองคัดลอกด้วยตนเอง', true); }
    }
    function embedCode() { return '<iframe src="' + shareUrl + (shareUrl.indexOf('?') === -1 ? '?' : '&') + 'embed=1" width="100%" height="640" style="border:0;" title="เกียรติบัตร" loading="lazy"></iframe>'; }
    function downloadQr() {
      var box = $('certShareQr'), cv = box.querySelector('canvas'), img = box.querySelector('img');
      var src = cv ? cv.toDataURL('image/png') : (img ? img.src : '');
      if (!src) return;
      var a = document.createElement('a'); a.href = src; a.download = 'qr-เกียรติบัตร.png'; document.body.appendChild(a); a.click(); a.remove();
    }

    // ================= จัดการชื่อกิจกรรม (รวมชื่อ) =================
    var mergePicked = {};
    function renderMerge() {
      var q = normName($('certMergeSearch').value);
      $('certMergeList').innerHTML = activities.filter(function (a) { return !q || normName(a.name).indexOf(q) !== -1; }).map(function (a) {
        return '<div class="cert-merge-item"><label><input type="checkbox" data-merge="' + escapeHtml(a.name) + '"' + (mergePicked[a.name] ? ' checked' : '') + ' /> <span>' + escapeHtml(a.name) + '</span></label><small>' + a.count + ' ใบ</small>' +
          '<button type="button" class="cert-add-link" data-merge-to="' + escapeHtml(a.name) + '">ใช้เป็นชื่อหลัก</button></div>';
      }).join('') || '<div class="hint" style="padding:8px;">ไม่พบชื่อกิจกรรม</div>';
      var from = Object.keys(mergePicked).filter(function (k) { return mergePicked[k] && k !== $('certMergeTo').value.trim(); });
      $('certMergeSave').disabled = !from.length || !$('certMergeTo').value.trim();
    }
    function openMerge() { mergePicked = {}; $('certMergeSearch').value = ''; $('certMergeTo').value = ''; $('certMergeError').hidden = true; renderMerge(); showModalEl($('certMergeModal')); }
    async function saveMerge() {
      var to = $('certMergeTo').value.replace(/\s+/g, ' ').trim();
      var from = Object.keys(mergePicked).filter(function (k) { return mergePicked[k] && k !== to; });
      if (!from.length || !to) return;
      var n = activities.filter(function (a) { return from.indexOf(a.name) !== -1; }).reduce(function (s, a) { return s + a.count; }, 0);
      var ok = await askConfirm('รวมชื่อกิจกรรม ' + from.length + ' ชื่อ (' + n + ' ใบ) เป็น "' + to + '"?', 'ยืนยันการรวมชื่อ');
      if (!ok) return;
      var r = await withProgress('กำลังรวมชื่อกิจกรรม...', function () { return apiCall('certRenameActivity', { from: from, to: to }); }, { successLabel: 'รวมชื่อกิจกรรมแล้ว' });
      if (r.ok) { hideModalEl($('certMergeModal')); await load(); }
      else { $('certMergeError').textContent = r.error.message; $('certMergeError').hidden = false; }
    }

    if (session) {
      mountChrome('certs');
      $('certAddIntBtn').addEventListener('click', function () { openModal('internal', null); });
      $('certAddExtBtn').addEventListener('click', function () { openModal('external', null); });
      $('certShareAllBtn').addEventListener('click', function () { openShare(null); });
      $('certMergeBtn').addEventListener('click', openMerge);
      $('certPendingAlert').addEventListener('click', function (e) {
        if (!e.target.closest('#certPendingShow')) return;
        $('certMine').value = 'pending';
        var first = certs.filter(function (c) { return c.isOwner && missingCount(c) > 0; })[0];
        if (first && first.scope !== scope) { scope = first.scope; fillFilters(); }
        $('certYear').value = ''; $('certActivity').value = ''; $('certSem').value = ''; kindFilter = '';
        render();
      });
      $('certTabs').addEventListener('click', function (e) { var b = e.target.closest('button[data-scope]'); if (!b) return; scope = b.getAttribute('data-scope'); try { localStorage.setItem(TAB_KEY, scope); } catch (x) { /* ไม่เป็นไร */ } fillFilters(); render(); });
      $('certKindSeg').addEventListener('click', function (e) { var b = e.target.closest('button[data-kind]'); if (!b) return; kindFilter = b.getAttribute('data-kind'); render(); });
      $('certSearch').addEventListener('input', render);
      ['certActivity', 'certYear', 'certSem', 'certMine'].forEach(function (id) { $(id).addEventListener('change', render); });
      // ----- ฟอร์ม -----
      $('certForm').addEventListener('submit', onSubmit);
      $('certCancel').addEventListener('click', closeModal);
      $('certCloseX').addEventListener('click', closeModal);
      $('certFKind').addEventListener('click', function (e) { var b = e.target.closest('button[data-kind]'); if (b && !b.disabled && !editing) setKind(b.getAttribute('data-kind')); });
      $('certFActivity').addEventListener('input', function () { simDecision = null; hideSimilar(); showActList(); });
      $('certFActivity').addEventListener('focus', showActList);
      $('certFActivity').addEventListener('blur', function () { setTimeout(function () { $('certActList').hidden = true; $('certFActivity').setAttribute('aria-expanded', 'false'); checkSimilar(); fillDatalists(); }, 180); });
      $('certActList').addEventListener('mousedown', function (e) { e.preventDefault(); });
      $('certActList').addEventListener('click', function (e) { var b = e.target.closest('[data-ac]'); if (b && $('certActList')._pick) $('certActList')._pick(Number(b.getAttribute('data-ac'))); });
      $('certSimilar').addEventListener('click', function (e) {
        var u = e.target.closest('[data-sim-use]');
        if (u) { var a = $('certSimilar')._sims[Number(u.getAttribute('data-sim-use'))]; $('certFActivity').value = a.name; simDecision = a.name; hideSimilar(); showErr(''); fillDatalists(); return; }
        if (e.target.closest('#certSimKeep')) { simDecision = $('certFActivity').value.replace(/\s+/g, ' ').trim(); hideSimilar(); showErr(''); }
      });
      $('certFYear').addEventListener('input', renderGroups);
      $('certFSem').addEventListener('change', renderGroups);
      $('certFDate').addEventListener('input', syncCertDate);
      $('certCompTg').addEventListener('click', function (e) { var b = e.target.closest('[data-comp]'); if (b) setHasComp(b.getAttribute('data-comp') === '1'); });
      $('certAddGroup').addEventListener('click', function () {
        var p = newPerson(); if (mKind === 'teacher' && me) p.userId = me.id;
        groups.push({ competition: '', award: '', people: [p] }); renderGroups();
        var gEl = $('certGroups').querySelector('[data-g-comp="' + (groups.length - 1) + '"]'); if (gEl) gEl.focus();
      });
      var G = $('certGroups');
      G.addEventListener('input', function (e) {
        var t = e.target, gi = t.getAttribute('data-g'), pi = t.getAttribute('data-p');
        if (t.hasAttribute('data-g-comp')) groups[Number(t.getAttribute('data-g-comp'))].competition = t.value;
        else if (t.hasAttribute('data-g-award')) groups[Number(t.getAttribute('data-g-award'))].award = t.value;
        else if (t.hasAttribute('data-p-name')) { groups[Number(gi)].people[Number(pi)].name = t.value; if (mScope === 'internal') refreshNumbers(); else updateNote(); }
        else if (t.hasAttribute('data-p-cls')) groups[Number(gi)].people[Number(pi)].cls = t.value;
      });
      G.addEventListener('change', function (e) {
        var t = e.target;
        if (t.hasAttribute('data-p-user')) { groups[Number(t.getAttribute('data-g'))].people[Number(t.getAttribute('data-p'))].userId = t.value; renderGroups(); }
      });
      // อัพเดตเฉพาะป้ายเลขที่ตัวอย่าง (ไม่วาดช่องพิมพ์ใหม่ ช่องพิมพ์ไม่หลุดโฟกัส)
      function refreshNumbers() {
        var pn = previewNumbers();
        groups.forEach(function (g, gi) { g.people.forEach(function (p, pi) {
          if (p.certNo) return;
          var row = G.querySelector('[data-p-name][data-g="' + gi + '"][data-p="' + pi + '"]'); if (!row) return;
          var no = row.parentNode.querySelector('.cert-no'); if (!no) return;
          var v = pn[gi + ':' + pi];
          no.className = 'cert-no ' + (v ? 'preview' : 'empty'); no.textContent = v || '—';
        }); });
        updateNote();
      }
      G.addEventListener('click', function (e) {
        var t = e.target.closest('[data-p-add],[data-p-rm],[data-g-rm],[data-f-pick],[data-f-clear],[data-f-multi],[data-p-paste],[data-paste-ok],[data-paste-cancel]');
        if (!t) return;
        var gi = Number(t.getAttribute('data-g')), pi = Number(t.getAttribute('data-p'));
        if (t.hasAttribute('data-p-add')) { var g0 = Number(t.getAttribute('data-p-add')); groups[g0].people.push(newPerson()); renderGroups(); var ins = G.querySelectorAll('[data-g="' + g0 + '"][data-p-name], [data-g="' + g0 + '"][data-p-user]'); if (ins.length) ins[ins.length - 1].focus(); return; }
        if (t.hasAttribute('data-p-rm')) {
          groups[gi].people.splice(pi, 1);
          if (!groups[gi].people.length) groups.splice(gi, 1);
          renderGroups(); return;
        }
        if (t.hasAttribute('data-g-rm')) { groups.splice(Number(t.getAttribute('data-g-rm')), 1); renderGroups(); return; }
        if (t.hasAttribute('data-f-pick')) { pickTarget = { g: gi, p: pi }; $('certPickFile').click(); return; }
        if (t.hasAttribute('data-f-clear')) { groups[gi].people[pi].newFile = null; renderGroups(); return; }
        if (t.hasAttribute('data-f-multi')) { pickTarget = { g: Number(t.getAttribute('data-f-multi')) }; $('certPickMulti').click(); return; }
        if (t.hasAttribute('data-p-paste')) { pasteOpen = Number(t.getAttribute('data-p-paste')); renderGroups(); var ta = $('certPasteText'); if (ta) ta.focus(); return; }
        if (t.hasAttribute('data-paste-cancel')) { pasteOpen = -1; renderGroups(); return; }
        if (t.hasAttribute('data-paste-ok')) {
          var g1 = Number(t.getAttribute('data-paste-ok')), lines = ($('certPasteText').value || '').split(/\r?\n/);
          var add = lines.map(function (ln) {
            var cols = ln.split('\t').map(function (x) { return x.replace(/\s+/g, ' ').trim(); }).filter(Boolean);
            if (!cols.length) return null;
            var cls = cols.length > 1 ? cols[cols.length - 1] : '';
            return { name: cols.length > 1 ? cols.slice(0, -1).join(' ') : cols[0], cls: cls };
          }).filter(Boolean);
          var ps = groups[g1].people.filter(personFilled).concat(add);
          groups[g1].people = ps.length ? ps : [newPerson()];
          pasteOpen = -1; renderGroups();
          showToast('เพิ่มรายชื่อ ' + add.length + ' คน');
        }
      });
      $('certPickFile').addEventListener('change', function (e) {
        var f = e.target.files && e.target.files[0]; e.target.value = '';
        if (!f || !pickTarget) return;
        var err = checkFile(f); if (err) return showErr(err);
        showErr('');
        groups[pickTarget.g].people[pickTarget.p].newFile = f; pickTarget = null; renderGroups();
      });
      $('certPickMulti').addEventListener('change', function (e) {
        var fs = Array.from(e.target.files || []); e.target.value = '';
        if (!fs.length || !pickTarget) return;
        var errs = fs.map(checkFile).filter(Boolean); if (errs.length) return showErr(errs.join(' · '));
        fs.sort(function (a, b) { return a.name.localeCompare(b.name, 'th', { numeric: true }); });
        var slots = groups[pickTarget.g].people.filter(function (p) { return personFilled(p) && !p.newFile && !p.file; });
        var n = Math.min(slots.length, fs.length);
        for (var i = 0; i < n; i++) slots[i].newFile = fs[i];
        showErr(fs.length > slots.length ? 'เลือกมา ' + fs.length + ' ไฟล์ แต่มีคนที่ยังไม่มีไฟล์ ' + slots.length + ' คน — ใส่ให้ ' + n + ' ไฟล์แรก (เรียงตามชื่อไฟล์)' : '');
        if (n) showToast('ใส่ไฟล์ให้ ' + n + ' คนตามลำดับรายชื่อ (เรียงตามชื่อไฟล์) — ตรวจชื่อไฟล์ท้ายแต่ละคนอีกครั้ง');
        pickTarget = null; renderGroups();
      });
      // ----- แชร์ -----
      $('certShareCopy').addEventListener('click', function () { copyText(shareUrl, 'คัดลอกลิงก์แล้ว'); });
      $('certShareEmbed').addEventListener('click', function () { copyText(embedCode(), 'คัดลอกโค้ดฝังเว็บไซต์แล้ว — นำไปวางในช่อง "ฝัง/Embed" ของเว็บไซต์'); });
      $('certShareQrDl').addEventListener('click', downloadQr);
      ['certShareClose', 'certShareCloseX'].forEach(function (id) { $(id).addEventListener('click', function () { hideModalEl($('certShareModal')); }); });
      // ----- รวมชื่อกิจกรรม -----
      $('certMergeSearch').addEventListener('input', renderMerge);
      $('certMergeTo').addEventListener('input', renderMerge);
      $('certMergeList').addEventListener('change', function (e) { var k = e.target.getAttribute('data-merge'); if (k !== null) { mergePicked[k] = e.target.checked; renderMerge(); } });
      $('certMergeList').addEventListener('click', function (e) { var b = e.target.closest('[data-merge-to]'); if (!b) return; $('certMergeTo').value = b.getAttribute('data-merge-to'); renderMerge(); });
      $('certMergeSave').addEventListener('click', saveMerge);
      $('certMergeCancel').addEventListener('click', function () { hideModalEl($('certMergeModal')); });
      $('certMergeCloseX').addEventListener('click', function () { hideModalEl($('certMergeModal')); });
      // ----- รายการ -----
      $('certItemFile').addEventListener('change', function (e) { var f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) uploadOne(f); });
      $('certRoot').addEventListener('keydown', function (ev) { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('[data-expand]')) { ev.preventDefault(); ev.target.click(); } });
      $('certRoot').addEventListener('click', async function (ev) {
        if (ev.target.closest('a[download]')) return;
        var t = ev.target.closest('[data-edit],[data-del],[data-preview],[data-expand-up],[data-expand],[data-it-view],[data-it-up],[data-share]');
        if (!t) return;
        var byId = function (attr) { var v = t.getAttribute(attr); return certs.filter(function (x) { return x.id === v; })[0]; };
        if (t.hasAttribute('data-expand-up')) { expanded[t.getAttribute('data-expand-up')] = true; render(); return; }
        if (t.hasAttribute('data-expand')) { var k = t.getAttribute('data-expand'); expanded[k] = !expanded[k]; render(); return; }
        if (t.hasAttribute('data-preview')) { var cp = byId('data-preview'); if (cp) previewItems(cp, ''); return; }
        if (t.hasAttribute('data-it-view')) { var cv = byId('data-it-view'); if (cv) previewItems(cv, t.getAttribute('data-it')); return; }
        if (t.hasAttribute('data-it-up')) {
          var cu = byId('data-it-up'); if (!cu) return;
          var it = (cu.items || []).filter(function (x) { return x.id === t.getAttribute('data-it'); })[0]; if (!it) return;
          itemTarget = { c: cu, it: it }; $('certItemFile').click(); return;
        }
        if (t.hasAttribute('data-share')) { var cs = byId('data-share'); if (cs) openShare(cs); return; }
        if (t.hasAttribute('data-edit')) { var ce = byId('data-edit'); if (ce) openModal(ce.scope, ce); return; }
        if (t.hasAttribute('data-del')) {
          var cd = byId('data-del'); if (!cd) return;
          var n = activeItems(cd).length, internal = cd.scope === 'internal';
          var msg = internal
            ? 'ยกเลิกเกียรติบัตรภายใน "' + cd.activity + '" ทั้ง ' + n + ' ใบ? เลขที่ ' + noRange(activeItems(cd)) + ' จะไม่ถูกนำกลับมาใช้ใหม่ (ดูย้อนหลังได้ที่ตัวกรอง "ที่ยกเลิกแล้ว") และไฟล์จะถูกย้ายลงถังขยะของ Google Drive'
            : 'ลบเกียรติบัตร "' + cd.activity + '" (' + n + ' ใบ)? ไฟล์จะถูกย้ายลงถังขยะของ Google Drive';
          if (!(await askConfirm(msg, internal ? 'ยกเลิกเกียรติบัตร' : 'ลบเกียรติบัตร'))) return;
          var r = await withProgress(internal ? 'กำลังยกเลิก...' : 'กำลังลบ...', function () { return apiCall('certDelete', { certId: cd.id }); }, { successLabel: internal ? 'ยกเลิกแล้ว' : 'ลบแล้ว' });
          if (r.ok) await load();
        }
      });
      load();
    }
  </script>
</body>
</html>
