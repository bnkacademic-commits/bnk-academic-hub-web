<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0b6fcc" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="BNK Hub" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<script>(function(){try{var t=localStorage.getItem('bnkah_theme');if(t==='dark'||t==='sepia')document.documentElement.setAttribute('data-theme',t);document.documentElement.classList.add('nav-noanim');if(localStorage.getItem('bnkah_memo_off')==='1')document.documentElement.classList.add('memo-off');}catch(e){}})();</script>
<title>นิเทศการสอน — BNKAcademicHub</title>
<link rel="stylesheet" href="assets/fontawesome/css/fontawesome.min.css" />
<link rel="stylesheet" href="assets/fontawesome/css/solid.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css?v=1.98.0.021126" />
<script>(function(){try{var c=localStorage.getItem('bnkah_theme_css');if(c){var e=document.createElement('style');e.id='bnkahThemeVars';e.textContent=c;document.head.appendChild(e);}}catch(e){}})();</script>
</head>
<body>
  <div id="app-topbar"></div>
  <!-- 1.98: นิเทศการสอน — ครูเลือกคาบ (วันในสัปดาห์ + คาบ) · ผู้จัดการงานนิเทศลงวันในปฏิทิน · ผู้นิเทศทำแบบประเมิน -->
  <div class="container">
    <div class="page-header">
      <div>
        <h1><i class="fa-solid fa-chalkboard-user ui-icon" style="color:var(--primary)" aria-hidden="true"></i> นิเทศการสอน</h1>
        <p id="spIntro">เลือกคาบรับการนิเทศ · ดูวันนิเทศ · ทำแบบประเมิน</p>
      </div>
      <div class="sp-roundpick" id="spRoundPick" hidden><label for="spRoundSel">รอบนิเทศ</label><select id="spRoundSel"></select></div>
    </div>
    <div class="sp-tabs" id="spTabs" role="tablist"></div>
    <div id="spBody"><div class="loading">กำลังโหลด...</div></div>
  </div>

  <!-- เลือกผู้นิเทศ / เปลี่ยนคาบแทนครู / ดูผลประเมิน (ใช้ป็อปอัปเดียว) -->
  <div class="modal-backdrop" id="spModal" hidden>
    <div class="modal-box modal-box-wide sp-modal-box">
      <button type="button" class="modal-close-x" data-sp-close aria-label="ปิด">✕</button>
      <h3 id="spModalTitle"></h3>
      <div id="spModalBody" style="text-align:left"></div>
      <div class="modal-actions" id="spModalActions"></div>
    </div>
  </div>
  <input type="file" id="spPlanFile" hidden />
  <div id="app-footer"></div>
  <script src="assets/api.js?v=1.98.0.021126"></script>
  <script>
    var session = requireLogin();
    if (session) { mountChrome('supervision'); if (typeof mountFooter === 'function') mountFooter(); }
    var DAYS = ['', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์'], DAYS_S = ['', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.'];
    var MS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
    var B = null;               // ผลจาก supBoot
    var st = { tab: '', roundId: '', D: null, busy: null, evals: null, tt: null, picks: {}, sel: '', pickDate: '', schedView: 'day', dutySel: '', mgrIds: null, extend: 0, onlyWait: true, filterGroup: '', q: '' };
    var body = document.getElementById('spBody');

    // ---------- ตัวช่วย ----------
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function ymdParts(s) { var p = String(s).split('-'); return { y: +p[0], m: +p[1], d: +p[2] }; }
    function dowOf(s) { var p = ymdParts(s); return new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay(); }
    function addD(s, n) { var p = ymdParts(s), d = new Date(Date.UTC(p.y, p.m - 1, p.d + n)); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
    function thD(s, withDay) { if (!s) return ''; var p = ymdParts(s); return (withDay ? DAYS_S[dowOf(s)] + ' ' : '') + p.d + ' ' + MS[p.m - 1] + ' ' + (p.y + 543); }
    function thDS(s) { var p = ymdParts(s); return p.d + ' ' + MS[p.m - 1]; }
    function semTxt(r) { return r.semester === 'summer' ? 'ภาคฤดูร้อน ' + r.academicYear : 'ภาคเรียนที่ ' + r.semester + '/' + r.academicYear; }
    function slotLabel(s) { return (s.code || s.subject || '') + (s.room ? ' ' + s.room : ''); }
    function roundOf(id) { return (B.rounds || []).filter(function (r) { return r.id === id; })[0] || null; }
    function nameOf(id) { var p = st.D && st.D.people.filter(function (x) { return x.id === id; })[0]; return p ? p.name : ''; }
    function err(msg) { return '<div class="error-box">' + escapeHtml(msg) + '</div>'; }
    function gradeOf(roomId) { return (/^m(\d)_/.exec(roomId || '') || [])[1] || ''; }
    function modal(title, html, actions) {
      document.getElementById('spModalTitle').innerHTML = title;
      document.getElementById('spModalBody').innerHTML = html;
      document.getElementById('spModalActions').innerHTML = (actions || '') + '<button type="button" class="btn btn-ghost btn-close" data-sp-close>ปิด</button>';
      showModalEl(document.getElementById('spModal'));
    }
    function closeModal() { hideModalEl(document.getElementById('spModal')); }
    document.getElementById('spModal').addEventListener('click', function (e) { if (e.target.closest('[data-sp-close]')) closeModal(); });

    // ---------- โหลด ----------
    async function boot(keepTab) {
      try { B = await apiCall('supBoot', {}); }
      catch (e) { body.innerHTML = err(e.message); return; }
      if (!B.sqlReady) { document.getElementById('spTabs').innerHTML = ''; body.innerHTML = '<div class="card">' + err('ยังใช้หน้านี้ไม่ได้ — ผู้ดูแลระบบต้องรัน SQL ชุดที่สามสิบสามก่อน (ดู README)') + '</div>'; return; }
      if (B.manager && (!st.roundId || !roundOf(st.roundId))) st.roundId = B.rounds[0] ? B.rounds[0].id : '';
      renderTabs(keepTab);
    }
    function tabList() {
      var t = [];
      if (B.mine.length) t.push(['mine', 'fa-user-check', 'คาบของฉัน']);
      if (B.duties.length) t.push(['duty', 'fa-clipboard-check', 'คาบที่ฉันต้องนิเทศ']);
      if (B.manager) t.push(['rounds', 'fa-layer-group', 'รอบนิเทศ'], ['sup', 'fa-users', 'ผู้นิเทศ'], ['form', 'fa-list-check', 'แบบประเมิน'], ['dates', 'fa-calendar-days', 'ลงวันนิเทศ'], ['sched', 'fa-table-list', 'ตารางนิเทศ']);
      if (B.superAdmin) t.push(['mgr', 'fa-user-shield', 'ผู้จัดการงานนิเทศ']);
      return t;
    }
    function renderTabs(keepTab) {
      var t = tabList();
      if (!t.length) { document.getElementById('spTabs').innerHTML = ''; body.innerHTML = '<div class="card sp-empty"><i class="fa-solid fa-chalkboard-user"></i><p>ยังไม่มีรอบนิเทศที่เกี่ยวกับคุณ</p></div>'; return; }
      if (!keepTab || !t.some(function (x) { return x[0] === st.tab; })) {
        var h = (location.hash || '').replace('#', '');
        st.tab = t.some(function (x) { return x[0] === h; }) ? h : t[0][0];
      }
      document.getElementById('spTabs').innerHTML = t.map(function (x) { return '<button type="button" role="tab" data-sp-tab="' + x[0] + '" class="' + (x[0] === st.tab ? 'on' : '') + '"><i class="fa-solid ' + x[1] + '" aria-hidden="true"></i> ' + x[2] + '</button>'; }).join('');
      renderRoundPick();
      show();
    }
    function renderRoundPick() {
      var mgrTab = ['sup', 'form', 'dates', 'sched'].indexOf(st.tab) !== -1, box = document.getElementById('spRoundPick');
      box.hidden = !(mgrTab && B.rounds.length);
      if (!box.hidden) document.getElementById('spRoundSel').innerHTML = B.rounds.map(function (r) { return '<option value="' + escapeHtml(r.id) + '"' + (r.id === st.roundId ? ' selected' : '') + '>' + escapeHtml(r.title) + '</option>'; }).join('');
    }
    document.getElementById('spRoundSel').addEventListener('change', function () { st.roundId = this.value; st.D = null; st.busy = null; st.evals = null; st.sel = ''; show(); });
    document.getElementById('spTabs').addEventListener('click', function (e) {
      var b = e.target.closest('[data-sp-tab]'); if (!b) return;
      st.tab = b.getAttribute('data-sp-tab'); try { history.replaceState(null, '', '#' + st.tab); } catch (x) { /* ข้าม */ }
      document.querySelectorAll('#spTabs [data-sp-tab]').forEach(function (x) { x.classList.toggle('on', x === b); });
      renderRoundPick(); show();
    });
    async function needDetail() {
      if (!st.roundId) return false;
      if (!st.D || st.D.round.id !== st.roundId) st.D = await apiCall('supRoundDetail', { roundId: st.roundId });
      return true;
    }
    async function show() {
      var fn = { mine: renderMine, duty: renderDuty, rounds: renderRounds, sup: renderSup, form: renderForm, dates: renderDates, sched: renderSched, mgr: renderMgr }[st.tab];
      try {
        if (['sup', 'form', 'dates', 'sched'].indexOf(st.tab) !== -1) {
          if (!B.rounds.length) { body.innerHTML = '<div class="card sp-empty"><i class="fa-solid fa-layer-group"></i><p>ยังไม่มีรอบนิเทศ — สร้างรอบที่แท็บ "รอบนิเทศ"</p></div>'; return; }
          if (!st.D || st.D.round.id !== st.roundId) body.innerHTML = '<div class="loading">กำลังโหลด...</div>';
          await needDetail();
        }
        await fn();
      } catch (e) { body.innerHTML = err(e.message); }
    }

    // ---------- ตารางสอน (เลือกคาบ) ----------
    function ttHtml(slots, picks, locked, opt) {
      opt = opt || {};
      var m = {}; (slots || []).forEach(function (x) { m[x.day + '-' + x.period] = x; });
      var h = '<div class="sp-tt-wrap"><table class="tt-grid sp-tt"><thead><tr><th class="tt-dh"></th>';
      for (var p = 1; p <= 8; p++) h += '<th>คาบ ' + p + '<small>' + (TT_TIMES[p] || '') + '</small></th>';
      h += '</tr></thead><tbody>';
      for (var d = 1; d <= 5; d++) {
        h += '<tr><td class="tt-day">' + DAYS_S[d] + '</td>';
        for (var p2 = 1; p2 <= 8; p2++) {
          var k = d + '-' + p2, x = m[k], on = picks[k];
          if (!x) { h += '<td></td>'; continue; }
          var g = gradeOf(x.roomId);
          h += '<td class="tt-c ' + (g ? 'g' + g : '') + (on ? (locked ? ' sp-lock' : ' sp-on') : '') + (locked ? '' : ' sp-can') + '"' + (locked ? '' : ' data-pick="' + k + '" role="button" tabindex="0"') + ' title="' + escapeHtml((x.subject || '') + ' ' + (x.room || '')) + '">' +
            '<div class="tt-in"><b>' + escapeHtml(x.code || x.subject) + '</b><span>' + escapeHtml(x.room || '') + '</span></div>' + (on ? '<span class="sp-badge">' + (locked ? escapeHtml(on === true ? 'คาบนิเทศ' : on) : 'เลือกแล้ว') + '</span>' : '') + '</td>';
        }
        h += '</tr>';
      }
      return h + '</tbody></table></div>';
    }
    async function loadMyTT() {
      if (st.tt) return st.tt;
      st.tt = await apiCall('supTimetable', {});
      return st.tt;
    }

    // ---------- แท็บ: คาบของฉัน (ครูผู้รับการนิเทศ) ----------
    async function renderMine() {
      body.innerHTML = '<div class="loading">กำลังโหลดตารางสอน...</div>';
      var tt = null; try { tt = await loadMyTT(); } catch (e) { tt = { linked: false, reason: e.message, slots: [] }; }
      var html = B.mine.map(function (m) {
        var r = roundOf(m.roundId); if (!r) return '';
        var dated = m.slots.some(function (s) { return s.date; }), today = todayYmd();
        var late = r.pickUntil && today > r.pickUntil;
        var head = '<div class="sp-rhead"><div><h2>' + escapeHtml(r.title) + '</h2><div class="mut">' + escapeHtml(semTxt(r)) + ' · ช่วงนิเทศ ' + thD(r.startDate) + ' – ' + thD(r.endDate) + (r.pickUntil ? ' · เลือกคาบได้ถึง ' + thD(r.pickUntil) : '') +
          ' · ผู้นิเทศ: ' + (m.supervisors.length ? m.supervisors.map(function (x) { return escapeHtml(x.name); }).join(', ') : '<i>รอกำหนด</i>') + '</div></div></div>';
        var planBox = '<div class="sp-plan">' + (m.plan ? '<a class="btn btn-secondary btn-sm" href="' + escapeHtml(m.plan.url) + '" target="_blank" rel="noopener"><i class="fa-solid fa-paperclip"></i> ' + escapeHtml(m.plan.name) + '</a> <button type="button" class="btn btn-ghost btn-sm" data-plan-del="' + escapeHtml(r.id) + '">ลบไฟล์</button>' :
          '<button type="button" class="btn btn-secondary btn-sm" data-plan-add="' + escapeHtml(r.id) + '"' + (m.slots.length ? '' : ' disabled title="เลือกคาบก่อน"') + '><i class="fa-solid fa-paperclip"></i> แนบแผนการสอน (ไม่บังคับ)</button>') + '</div>';
        if (dated) {
          var picks = {}; m.slots.forEach(function (s) { picks[s.day + '-' + s.period] = s.date ? 'นิเทศ ' + thDS(s.date) : 'รอลงวัน'; });
          return '<div class="card sp-round">' + head +
            '<div class="sp-info"><i class="fa-solid fa-bell"></i> เจ้าหน้าที่ลงวันนิเทศให้แล้ว — เปลี่ยนวันหรือคาบ ติดต่อผู้จัดการงานนิเทศ</div>' +
            '<div class="sp-bigs">' + m.slots.map(function (s) {
              return '<div class="sp-big' + (s.date ? '' : ' wait') + '"><span>' + (s.date ? 'วัน' + DAYS[dowOf(s.date)] : 'ทุกวัน' + DAYS[s.day]) + '</span><b>' + (s.date ? thDS(s.date) : 'รอลงวัน') + '</b><span>' + (s.date ? (ymdParts(s.date).y + 543) + ' · ' : '') + 'คาบ ' + s.period + '</span><small>' + escapeHtml(slotLabel(s)) + '</small></div>';
            }).join('') + '<div class="sp-bigside">' + planBox + '</div></div>' +
            (tt && tt.linked ? '<h3 class="sp-h3">ตารางสอนของคุณ</h3>' + ttHtml(tt.slots, picks, true) : '') + '</div>';
        }
        // ยังไม่ลงวัน: เลือก/เปลี่ยนคาบได้ (จนถึงวันที่กำหนด)
        if (!st.picks[r.id]) { st.picks[r.id] = {}; m.slots.forEach(function (s) { st.picks[r.id][s.day + '-' + s.period] = true; }); }
        var pk = st.picks[r.id], keys = Object.keys(pk), saved = m.slots.length > 0;
        var savedSame = saved && keys.length === m.slots.length && m.slots.every(function (s) { return pk[s.day + '-' + s.period]; });
        var desc = keys.map(function (k) { var x = (tt && tt.slots || []).filter(function (y) { return y.day + '-' + y.period === k; })[0], d = +k.split('-')[0], p = +k.split('-')[1]; return 'ทุกวัน' + DAYS[d] + ' คาบ ' + p + (x ? ' · ' + slotLabel(x) : ''); }).join(' / ');
        var grid = !tt || !tt.linked ? err((tt && tt.reason) || 'ยังไม่พบตารางสอนของคุณในเว็บเช็คชื่อ — ติดต่อผู้ดูแลเว็บเช็คชื่อให้ผูกรายชื่อครูกับ AcademicHub') : ttHtml(tt.slots, pk, late);
        return '<div class="card sp-round" data-round="' + escapeHtml(r.id) + '">' + head +
          (late ? '<div class="sp-warn"><i class="fa-solid fa-lock"></i> หมดเวลาเลือกคาบแล้ว' + (saved ? '' : ' — ติดต่อผู้จัดการงานนิเทศ') + '</div>' : '<p class="mut" style="margin:6px 0 8px">แตะคาบในตารางสอนที่ต้องการรับการนิเทศ ' + r.perTeacher + ' คาบ (เลือกวันในสัปดาห์ + คาบ — วันที่จริงเจ้าหน้าที่จะลงให้ภายหลัง)</p>') +
          grid +
          '<div class="sp-bar"><span>คาบที่เลือก: <b class="ok">' + (keys.length ? escapeHtml(desc) : '—') + '</b> <small class="mut">(' + keys.length + '/' + r.perTeacher + ')</small>' + (savedSame ? ' <span class="sp-st ok">ส่งแล้ว · รอเจ้าหน้าที่ลงวันที่</span>' : '') + '</span>' +
          planBox + (late ? '' : '<button type="button" class="btn btn-success" data-pick-save="' + escapeHtml(r.id) + '"' + (keys.length === r.perTeacher && !savedSame ? '' : ' disabled') + '><i class="fa-solid fa-check"></i> ' + (saved ? 'บันทึกคาบที่เปลี่ยน' : 'ส่งคาบที่เลือก') + '</button>') + '</div></div>';
      }).join('');
      body.innerHTML = html || '<div class="card sp-empty"><p>ไม่มีรอบนิเทศ</p></div>';
      if (typeof ttShrink === 'function') ttShrink(body);
    }
    function togglePick(roundId, k) {
      var r = roundOf(roundId), pk = st.picks[roundId] || (st.picks[roundId] = {});
      if (pk[k]) delete pk[k];
      else { if (r.perTeacher === 1) { st.picks[roundId] = {}; pk = st.picks[roundId]; } else if (Object.keys(pk).length >= r.perTeacher) { showToast('เลือกได้ ' + r.perTeacher + ' คาบ — แตะคาบเดิมเพื่อยกเลิกก่อน', true); return; } pk[k] = true; }
      renderMine();
    }
    body.addEventListener('click', async function (e) {
      var t;
      if (st.tab === 'mine' && (t = e.target.closest('[data-pick]'))) { togglePick(t.closest('[data-round]').getAttribute('data-round'), t.getAttribute('data-pick')); return; }
      if ((t = e.target.closest('[data-pick-save]'))) {
        var rid = t.getAttribute('data-pick-save'), picks = Object.keys(st.picks[rid] || {}).map(function (k) { return { day: +k.split('-')[0], period: +k.split('-')[1] }; });
        var r = await withProgress('กำลังบันทึกคาบที่เลือก', function () { return apiCall('supPickSave', { roundId: rid, picks: picks }); }, { successLabel: 'ส่งคาบที่เลือกแล้ว — รอเจ้าหน้าที่ลงวันที่' });
        if (r.ok) { delete st.picks[rid]; await boot(true); }
        return;
      }
      if ((t = e.target.closest('[data-plan-add]'))) { var f = document.getElementById('spPlanFile'); f.__round = t.getAttribute('data-plan-add'); f.click(); return; }
      if ((t = e.target.closest('[data-plan-del]'))) {
        if (!(await askConfirm('ลบไฟล์แผนการสอนที่แนบไว้?', 'ลบไฟล์'))) return;
        try { await apiCall('supPlanRemove', { roundId: t.getAttribute('data-plan-del') }); await boot(true); } catch (x) { showToast(x.message, true); }
        return;
      }
      var h = handlers[st.tab]; if (h) h(e);
    });
    body.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('[data-pick],[data-cal]')) { e.preventDefault(); e.target.click(); } });
    document.getElementById('spPlanFile').addEventListener('change', async function () {
      var file = this.files && this.files[0], rid = this.__round; this.value = '';
      if (!file || !rid) return;
      var r = await withProgress('กำลังแนบแผนการสอน', async function (p) {
        var prep = await apiCall('supPlanPrepare', { roundId: rid, fileName: file.name, mimeType: file.type, fileSize: file.size, direct: 1, origin: location.origin });
        var res = await sendPreparedFileProgress(prep, file, p, 5, 92, 'กำลังอัปโหลด ' + file.name, { filename: prep.uploadFileName || file.name, mimeType: file.type });
        return apiCall('supPlanFinalize', { roundId: rid, planId: prep.planId, fileId: res.fileId, fileUrl: res.url, directUrl: res.directUrl, fileName: prep.uploadFileName || file.name, mimeType: file.type, via: res.via, fallbackReason: res.fallbackReason || '' });
      }, { successLabel: 'แนบแผนการสอนแล้ว', upload: true });
      if (r.ok) await boot(true);
    });

    // ---------- แท็บ: คาบที่ฉันต้องนิเทศ (ผู้นิเทศ) ----------
    function dutyKey(d) { return d.slot ? d.slot.id : 'n:' + d.roundId + ':' + d.teacherId; }
    function renderDuty() {
      var list = B.duties.slice().sort(function (a, b) { return ((a.slot && a.slot.date) || '9999').localeCompare((b.slot && b.slot.date) || '9999') || String(a.teacherName).localeCompare(String(b.teacherName), 'th'); });
      if (!st.dutySel || !list.some(function (d) { return dutyKey(d) === st.dutySel; })) { var f = list.filter(function (d) { return d.slot && d.slot.date && !d.myEval; })[0] || list[0]; st.dutySel = f ? dutyKey(f) : ''; }

    // ---------- แท็บ: ตารางนิเทศ (ผู้จัดการ) ----------
    async function ensureEvals() { if (!st.evals) st.evals = (await apiCall('supEvalList', { roundId: st.roundId })).evals || []; return st.evals; }

    }
    function schedWarnings(rows) {

          return '<tr><td class="nw"><b>' + thD(x.s.date, true) + '</b></td><td>' + x.s.period + '</td><td>' + escapeHtml(x.t.name) + '</td><td>' + escapeHtml((x.s.code ? x.s.code + ' ' : '') + (x.s.subject && x.s.subject !== x.s.code ? x.s.subject : '') + ' · ' + x.s.room) + '</td><td>' + escapeHtml(x.t.supervisors.map(nameOf).join(', ')) + '</td><td>' + evCell(x) + '</td></tr>';

    function avgOf(e, form) { var xs = form.filter(function (f) { return f.type === 'rating' && e.answers[f.id]; }).map(function (f) { return +e.answers[f.id]; }); return xs.length ? xs.reduce(function (a, b) { return a + b; }, 0) / xs.length : null; }

    function fileStem() { return 'นิเทศ-' + st.D.round.title.replace(/[\\/:*?"<>|]+/g, ' ').slice(0, 60); }

        var fr = document.createElement('iframe'); fr.style.cssText = 'position:fixed;left:-20000px;top:0;width:1140px;height:820px;border:0;'; document.body.appendChild(fr);

          if (d.fonts && d.fonts.load) { try { await Promise.all(['400', '700'].map(function (w) { return d.fonts.load(w + ' 16px Sarabun', 'กขค ABC 123'); })); await d.fonts.ready; } catch (fe) { /* ฟอนต์สำรอง */ } }
